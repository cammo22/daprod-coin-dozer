# Compila l'APK Android di DaProd Coin Dozer.
#  - su ogni PR che tocca il gioco o l'app: compila e lascia l'APK fra gli artefatti
#  - su un tag vX.Y.Z: compila e pubblica la release GitHub con l'APK allegato
#
# Firma: se nel repository ci sono i segreti ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD si firma con quella chiave (gli aggiornamenti si installano
# sopra la versione vecchia). Senza segreti si usa la chiave di debug del runner: l'APK si installa lo
# stesso, ma per aggiornare può servire disinstallare la versione precedente.
name: APK Android

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['index.html', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gioco e three.js negli asset dell'app
        run: |
          npm i --no-save three@0.160.0
          node android/prepara-www.mjs

      - name: Chiave di firma (se c'è)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/daprod.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/daprod.keystore" >> "$GITHUB_ENV"
            echo "firma con la chiave DaProd"
          else
            echo "nessun segreto: firma con la chiave di debug"
          fi

      - name: Compila l'APK
        working-directory: android
        env:
          VERSIONE: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Nome del file
        id: nome
        run: |
          V="${{ github.ref_type == 'tag' && github.ref_name || 'prova' }}"
          F="DaProd-Coin-Dozer-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$F"
          echo "file=$F" >> "$GITHUB_OUTPUT"
          ls -la "$F"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.file }}
          path: ${{ steps.nome.outputs.file }}

      - name: Release GitHub con l'APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.nome.outputs.file }}
        run: |
          # note della release: la sezione del CHANGELOG di questa versione
          V="${TAG#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > note.md
          TITOLO=$(grep -m1 "^## \[$V\]" CHANGELOG.md | sed -E 's/^## \[[^]]*\] — [0-9-]+ · //')
          {
            echo ""
            echo "### 📱 Android"
            echo "Scarica **$FILE** qui sotto e aprilo sul telefono (consenti l'installazione da origini sconosciute). Il gioco funziona anche offline."
            echo ""
            echo "▶ Oppure gioca dal browser: https://cammo22.github.io/daprod-coin-dozer/"
          } >> note.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "$TAG · ${TITOLO:-DaProd Coin Dozer}" --notes-file note.md
          fi
