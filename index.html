<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="DaProd Coin Dozer — sala slot con lire, cannone, raffica e potenziamenti. Gioca da telefono o desktop.">
<meta name="author" content="DaProd">
<title>DaProd · Coin Dozer — Sala Slot</title>
<style>
  :root {
    --oro: #ffd54a; --oro2: #ffab00; --vetro: rgba(13,10,22,.74);
    --bordo: rgba(255,213,74,.30); --raggio: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #08070f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  button, .tondo, .chip, .compra, .inter, .tab button, .box.premi {
    touch-action: manipulation;   /* tocco immediato, niente zoom da doppio tap */
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  #vignetta { position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 42%, rgba(0,0,0,.62) 100%); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0 0 auto 0; padding: 16px 18px; z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none; }
  .marchio { background: var(--vetro); backdrop-filter: blur(12px);
    border: 1px solid var(--bordo); border-radius: var(--raggio);
    padding: 10px 18px 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }
  .logo { font-size: 27px; font-weight: 900; letter-spacing: 2.5px; line-height: 1;
    background: linear-gradient(180deg, #fff6c4, var(--oro) 45%, #a9761b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: neon 3.2s ease-in-out infinite; }
  @keyframes neon { 0%,100% { filter: drop-shadow(0 0 9px rgba(255,180,0,.45)); }
                    50% { filter: drop-shadow(0 0 20px rgba(255,205,70,.9)); } }
  .marchio .sub { font-size: 9.5px; letter-spacing: 3px; color: #c9b98a; margin-top: 5px; font-weight: 700; }
  .stat { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
  .box { background: var(--vetro); backdrop-filter: blur(12px); border: 1px solid var(--bordo);
    border-radius: var(--raggio); padding: 9px 16px 10px; min-width: 96px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    font-size: 9.5px; letter-spacing: 2px; color: #cdbd8e; font-weight: 700; }
  .box b { display: block; margin-top: 3px; font-size: 21px; letter-spacing: .5px;
    color: var(--oro); text-shadow: 0 0 14px rgba(255,180,0,.5); }
  .box.idle { min-width: 138px; }
  .box.idle b { font-size: 14px; margin-top: 2px; color: #7ef0c0;
    text-shadow: 0 0 12px rgba(90,255,190,.45); }
  #taglioOra { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 8;
    font: 800 10.5px/1 inherit; letter-spacing: 1.6px; color: #ffd54a;
    background: rgba(12,9,22,.72); border: 1px solid rgba(255,213,74,.3);
    padding: 7px 13px; border-radius: 999px; pointer-events: none;
    text-shadow: 0 0 10px rgba(255,180,0,.5); }
  .box.premi { pointer-events: auto; cursor: pointer; }
  .box.premi:hover { border-color: var(--oro); }
  .box.premi:active { transform: scale(.98); }
  .barra { display: block; height: 5px; border-radius: 999px; background: rgba(255,255,255,.12);
    margin-top: 6px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #23c48a, #7ef0c0); transition: width .15s linear; }
  /* ---------- pulsanti ---------- */
  .tondo { position: fixed; z-index: 12; border: 1px solid var(--bordo); cursor: pointer;
    background: linear-gradient(180deg, rgba(40,32,60,.92), rgba(18,14,30,.92));
    color: var(--oro); font: 800 12px/1 inherit; letter-spacing: 1.4px;
    border-radius: 999px; padding: 13px 20px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14);
    transition: transform .12s ease, box-shadow .2s ease, filter .2s; }
  .tondo:hover { transform: translateY(-2px); filter: brightness(1.15);
    box-shadow: 0 14px 30px rgba(255,170,0,.22), inset 0 1px 0 rgba(255,255,255,.2); }
  .tondo:active { transform: translateY(0) scale(.97); }
  #apriNegozio { right: 18px; bottom: 18px; }
  #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 11;
    background: var(--vetro); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.14);
    padding: 10px 20px; border-radius: 999px; font-size: 12.5px; color: #d6d0e0;
    letter-spacing: .4px; pointer-events: none; text-align: center; max-width: 74vw; }
  #hint kbd { background: linear-gradient(180deg,#2a2440,#171320); padding: 3px 9px; border-radius: 8px;
    border: 1px solid #4a4166; font: inherit; font-size: 11.5px; color: #fff; }

  /* ---------- barra abilità (interruttori ON/OFF) ---------- */
  /* il contenitore non ruba i tocchi: solo i chip sono cliccabili */
  #abilita { position: fixed; left: 18px; bottom: 18px; z-index: 12;
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 52vw; pointer-events: none; }
  .chip { pointer-events: auto; border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(34,27,54,.94), rgba(16,12,28,.94));
    color: #cfc7de; font: 800 10.5px/1 inherit; letter-spacing: 1.3px;
    padding: 11px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(10px);
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .14s, border-color .2s, color .2s, opacity .2s; }
  .chip:hover { transform: translateY(-2px); }
  .chip .led { width: 8px; height: 8px; border-radius: 50%; background: #4a415f;
    transition: background .2s, box-shadow .2s; }
  .chip.on { color: #eaffe9; border-color: rgba(126,240,192,.55); }
  .chip.on .led { background: #7ef0c0; box-shadow: 0 0 10px rgba(126,240,192,.9); }
  .chip.off .led { background: #7a7392; }
  .chip.bloccata { opacity: .42; color: #8d8598; cursor: not-allowed;
    border-color: rgba(255,255,255,.08); background: rgba(255,255,255,.04); }
  .chip.bloccata:hover { transform: none; }
  .chip.audio.on { color: #fff3c4; border-color: rgba(255,213,74,.55); }
  .chip.audio.on .led { background: var(--oro); box-shadow: 0 0 10px rgba(255,213,74,.9); }
  .chip small { opacity: .7; font-weight: 700; letter-spacing: .5px; }

  /* ---------- interruttori nel negozio ---------- */
  .inter { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,.06); color: #cfc7de; font: 900 11px/1 inherit;
    letter-spacing: 1.4px; padding: 12px 18px; min-width: 104px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .16s; }
  .inter span.pallino { width: 10px; height: 10px; border-radius: 50%; background: #6b6480; }
  .inter.acceso { background: linear-gradient(180deg, #bff7e2, #46d39c); color: #0d231b;
    border-color: transparent; box-shadow: 0 8px 20px rgba(70,211,156,.25); }
  .inter.acceso span.pallino { background: #0d231b; }
  .inter:disabled { opacity: .40; cursor: not-allowed; }

  /* ---------- carica cannone ---------- */
  #carica { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 11;
    width: 280px; opacity: 0; transition: opacity .15s; pointer-events: none; text-align: center; }
  #carica.attiva { opacity: 1; }
  #carica .track { height: 13px; border-radius: 999px; background: rgba(10,8,18,.85);
    border: 1px solid var(--bordo); overflow: hidden; }
  #carica .track i { display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff7a18, #ffd54a, #fff3b0); }
  #carica span { display: inline-block; margin-top: 6px; font-size: 10px; letter-spacing: 2.4px;
    color: var(--oro); font-weight: 800; }

  /* ---------- testi volanti e combo ---------- */
  #floaters { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
  .floater { position: absolute; transform: translate(-50%, -50%); font-weight: 900;
    font-size: 26px; color: var(--oro);
    text-shadow: 0 0 16px rgba(255,170,0,.85), 0 2px 0 #7a5200;
    animation: sali 1.05s ease-out forwards; }
  .floater.torre { color: #7ef0c0; font-size: 22px; text-shadow: 0 0 16px rgba(90,255,190,.75); }
  .floater.bonus { color: #ff9ec4; text-shadow: 0 0 16px rgba(255,120,190,.8); }
  @keyframes sali {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
    18% { opacity: 1; transform: translate(-50%,-70%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-200%) scale(.95); } }
  #combo { position: fixed; left: 50%; top: 21%; transform: translateX(-50%); z-index: 9;
    font-size: 46px; font-weight: 900; color: #fff; opacity: 0; pointer-events: none;
    text-shadow: 0 0 26px rgba(255,140,0,.9), 0 3px 0 #7a3d00; }
  #combo.mostra { animation: comboPop 1s ease-out; }
  @keyframes comboPop {
    0% { opacity: 0; transform: translateX(-50%) scale(.4); }
    22% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    75% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(1.05) translateY(-28px); } }

  .lampo {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, rgba(255,215,0,.42), transparent 62%);
    animation: lampo .55s ease-out forwards;
  }
  @keyframes lampo { to { opacity: 0; transform: scale(1.5); } }
  /* ---------- negozio ---------- */
  #negozio { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(5,4,10,.62); backdrop-filter: blur(6px); transition: opacity .2s; }
  #negozio.chiuso { opacity: 0; pointer-events: none; }
  .pannello { width: min(760px, 94vw); max-height: 88vh; overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(26,20,44,.97), rgba(12,9,22,.97));
    border: 1px solid var(--bordo); border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1); }
  .pannello header { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .pannello h2 { font-size: 19px; letter-spacing: 2px; color: var(--oro); font-weight: 900; }
  .pannello h2 small { display: block; font-size: 10px; letter-spacing: 2.5px;
    color: #a99c78; margin-top: 4px; font-weight: 700; }
  #chiudiNegozio { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
    color: #fff; width: 36px; height: 36px; border-radius: 12px; cursor: pointer;
    font-size: 15px; font-weight: 800; }
  #chiudiNegozio:hover { background: rgba(255,255,255,.14); }
  .tab { display: flex; gap: 8px; padding: 14px 22px 0; }
  .tab button { flex: 1; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    color: #cfc7de; font: 800 11.5px/1 inherit; letter-spacing: 1.6px; padding: 12px 10px;
    border-radius: 14px; cursor: pointer; transition: all .18s; }
  .tab button.sel { color: #14101f; background: linear-gradient(180deg, #ffe89a, var(--oro2));
    border-color: transparent; box-shadow: 0 8px 22px rgba(255,170,0,.3); }
  .voci { padding: 16px 20px 24px; overflow-y: auto; display: grid; gap: 12px;
    flex: 1 1 auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .titolo-sezione { font: 900 10.5px/1 inherit; letter-spacing: 2.4px; color: #8f86a8;
    margin: 6px 2px 0; }
  .saldo-bar { position: sticky; top: -16px; z-index: 2; margin: -4px 0 2px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center;
    background: rgba(12,9,22,.92); border: 1px solid rgba(255,213,74,.22);
    border-radius: 14px; padding: 9px 14px; font: 800 11px/1 inherit; letter-spacing: 1.4px;
    color: #cbbf9a; backdrop-filter: blur(6px); }
  .saldo-bar b { color: var(--oro); font-size: 14px; margin-left: 4px; }
  .voce { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
    border: 1px solid rgba(255,255,255,.13);
    border-left: 4px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 15px 16px; transition: border-color .2s, transform .15s, background .2s; }
  .voce:hover { border-color: var(--bordo); transform: translateY(-1px); }
  /* quello che puoi permetterti si illumina: si capisce subito cosa comprare */
  .voce.ok { border-left-color: var(--oro); background: linear-gradient(180deg, rgba(255,213,74,.11), rgba(255,255,255,.035)); }
  .voce.max { border-left-color: #7ef0c0; }
  .voce .nome { font-weight: 900; font-size: 14.5px; letter-spacing: .5px; color: #fff;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .voce .nome em { font-style: normal; color: #7ef0c0; font-size: 9.5px; font-weight: 800;
    letter-spacing: 1.6px; background: rgba(126,240,192,.13); border: 1px solid rgba(126,240,192,.3);
    padding: 3px 7px; border-radius: 999px; }
  .voce .desc { font-size: 12.5px; color: #bdb4d2; margin-top: 6px; line-height: 1.5; }
  .voce .lv { font-size: 10.5px; letter-spacing: 1.6px; color: var(--oro); font-weight: 900; margin-top: 7px; }
  .voce .manca { color: #ff9ec4; font-weight: 800; letter-spacing: .6px; }
  .voce .ico { display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 12px; margin-right: 4px; flex: none;
    background: linear-gradient(180deg, rgba(255,213,74,.22), rgba(255,213,74,.08));
    border: 1px solid rgba(255,213,74,.38); font-size: 17px; }
  .voce.max .ico { background: linear-gradient(180deg, rgba(126,240,192,.22), rgba(126,240,192,.08));
    border-color: rgba(126,240,192,.4); }
  .prog { position: relative; height: 18px; border-radius: 999px; overflow: hidden;
    background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.13);
    margin-top: 9px; max-width: 300px; }
  .prog i { display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #ffe89a, var(--oro2));
    box-shadow: 0 0 12px rgba(255,180,0,.45); }
  .prog span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 900 9.5px/1 inherit; letter-spacing: 1.6px; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  .compra { border: 1px solid rgba(255,255,255,.16); border-radius: 15px; cursor: pointer;
    background: linear-gradient(180deg, #ffe89a, var(--oro2)); color: #171024;
    font: 900 12.5px/1.15 inherit; letter-spacing: 1px; padding: 14px 16px; min-width: 138px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 10px 22px rgba(255,170,0,.22);
    transition: transform .12s, filter .2s, box-shadow .2s; }
  .compra b { font-size: 17px; letter-spacing: .4px; }
  .compra i { font-style: normal; font-size: 9.5px; letter-spacing: 1.4px; opacity: .78; font-weight: 800; }
  .compra:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 14px 28px rgba(255,170,0,.35); }
  .compra:disabled { background: rgba(255,255,255,.07); color: #948ca8; cursor: not-allowed;
    transform: none; filter: none; border-color: rgba(255,255,255,.1); box-shadow: none; }
  .compra:disabled b { color: #cfc7de; }
  .voce.max .compra { background: rgba(126,240,192,.18); color: #7ef0c0;
    border-color: transparent; box-shadow: none; }
  .riepilogo { font-size: 13px; color: #d3cbe4; line-height: 2.05; }
  .riepilogo b { color: var(--oro); }
  .nav { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  /* ---------- pulsante sparo per touch (telefono) ---------- */
  #spara { position: fixed; right: 18px; bottom: 70px; z-index: 12; display: none;
    align-items: center; gap: 8px; }
  .tCorto { display: none; }   /* su schermi grandi si legge il nome lungo */

  /* ---------- telefono / schermi stretti ---------- */
  @media (max-width: 780px), (max-height: 520px) {
    /* HUD in colonna: logo sopra, statistiche sotto */
    #hud { flex-direction: column; align-items: stretch; gap: 6px;
      padding: max(8px, env(safe-area-inset-top)) 10px 6px; }
    .marchio { align-self: flex-start; padding: 7px 12px 8px; border-radius: 14px; }
    .logo { font-size: 19px; letter-spacing: 1.6px; }
    .marchio .sub { font-size: 7.5px; letter-spacing: 1.8px; margin-top: 3px; }
    .stat { justify-content: flex-start; gap: 5px; }
    .box { padding: 6px 10px 7px; min-width: 62px; font-size: 7.5px; letter-spacing: 1.2px; border-radius: 13px; }
    .box b { font-size: 15px; margin-top: 2px; }
    .box.idle { min-width: 92px; }
    .box.idle b { font-size: 10.5px; }
    .barra { height: 4px; margin-top: 4px; }

    #hint { top: 146px; bottom: auto; font-size: 9.5px; padding: 6px 11px; max-width: 94vw;
      letter-spacing: .2px; line-height: 1.5; }
    #hint kbd { padding: 2px 6px; font-size: 9px; }

    /* chip in griglia, senza coprire i pulsanti in basso a destra */
    #abilita { left: 8px; right: 148px; bottom: max(8px, env(safe-area-inset-bottom));
      max-width: none; display: grid; gap: 5px;
      grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); }
    .chip { padding: 9px 6px; font-size: 9px; letter-spacing: .8px; gap: 6px;
      justify-content: center; text-align: center; }
    .chip .led { width: 6px; height: 6px; flex: none; }
    .chip small { display: none; }

    /* pulsanti in basso a destra: NEGOZIO (nome corto) e sopra SPARA */
    .tLungo { display: none; }
    .tCorto { display: inline; }
    #apriNegozio { right: 8px; bottom: max(8px, env(safe-area-inset-bottom));
      padding: 12px 13px; font-size: 10px; letter-spacing: 1px; max-width: 136px; }
    #spara { right: 8px; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 56px);
      padding: 11px 12px; font-size: 10.5px; }
    #carica { width: 58vw; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 112px); }
    #carica .track { height: 10px; }
    #taglioOra { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 146px); font-size: 9.5px; }
    #combo { font-size: 32px; top: 26%; }
    .floater { font-size: 20px; }
    .floater.torre { font-size: 17px; }

    .pannello { width: 96vw; max-height: 92vh; border-radius: 20px; }
    .pannello header { padding: 13px 15px 11px; }
    .pannello h2 { font-size: 15px; letter-spacing: 1.4px; }
    .pannello h2 small { font-size: 8.5px; letter-spacing: 1.8px; }
    #chiudiNegozio { width: 42px; height: 42px; }
    .tab { padding: 11px 15px 0; gap: 6px; }
    .tab button { padding: 10px 4px; font-size: 9.5px; letter-spacing: .8px; border-radius: 11px; }
    .voci { padding: 11px 15px 16px; gap: 9px; }
    .voce { padding: 12px 13px; border-radius: 15px; gap: 8px 10px; border-left-width: 4px; }
    .voce .nome { font-size: 13px; }
    .voce .desc { font-size: 12px; color: #c6bddb; }
    .voce .ico { width: 30px; height: 30px; font-size: 15px; border-radius: 10px; }
    .voce .lv { font-size: 10px; }
    .prog { height: 16px; max-width: none; }
    .prog span { font-size: 9px; }
    .saldo-bar { font-size: 10px; padding: 8px 11px; gap: 7px; top: -16px; }
    .saldo-bar b { font-size: 12.5px; }
    .titolo-sezione { font-size: 9.5px; letter-spacing: 1.8px; }
    .compra { padding: 12px 12px; min-width: 108px; font-size: 11.5px; border-radius: 13px; }
    .compra b { font-size: 15.5px; }
    .compra i { font-size: 8.5px; letter-spacing: 1px; }
    .inter { min-width: 78px; padding: 10px 11px; font-size: 10px; }
  }
  @media (max-width: 430px) {
    .chip { padding: 8px 4px; font-size: 8.5px; }
    #abilita { right: 150px; }
    /* righe a colonna singola: prezzo grande e facile da premere col pollice */
    .voce { grid-template-columns: 1fr; }
    .compra, .inter { width: 100%; }
    .compra { flex-direction: row; justify-content: space-between; padding: 14px 16px; }
    .prog { max-width: none; }
  }
</style>
</head>
<body>
<div id="vignetta"></div>
<div id="hud">
  <div class="marchio">

<script type="module">
import * as THREE from 'three';

// ============ AMBIENTE ============
// Telefono/tablet: niente tasto destro, quindi lo sparo ha un pulsante dedicato
const TATTILE = (typeof matchMedia === 'function') &&
  (matchMedia('(hover: none)').matches || matchMedia('(pointer: coarse)').matches);

// Se qualcosa va storto, lo dico a schermo invece di lasciare il gioco nero
function mostraErrore(msg) {
  try {
    let box = document.getElementById('erroreGioco');
    if (!box) {
      box = document.createElement('div');
      box.id = 'erroreGioco';
      box.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;' +
        'background:rgba(120,10,20,.95);border:1px solid #ff6b81;border-radius:14px;padding:12px 18px;' +
        'font:700 12px/1.5 -apple-system,Segoe UI,sans-serif;color:#fff;max-width:92vw;text-align:center;';
      document.body.appendChild(box);
    }
    box.textContent = '⚠️ ' + msg + ' — ricarica la pagina (Ctrl+Shift+R).';
  } catch (e) {}
}
addEventListener('error', (e) => mostraErrore(e && e.message ? e.message : 'errore sconosciuto'));

// ============ SUONO (tutto sintetizzato, nessun file esterno) ============
let audioCtx = null;
function audioOn() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function nota(freq, dur, tipo = 'sine', vol = 0.15, ritardo = 0) {
  const c = audioOn(); if (!c || !stato.audio) return;
  const t = c.currentTime + ritardo;
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.99, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function soffio(dur, freq, vol = 0.2, q = 1.2) {
  const c = audioOn(); if (!c || !stato.audio) return;
  const n = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(c.destination); s.start();
}
// ============ STATO, ECONOMIA E SALVATAGGIO ============
const CHIAVE_SALVATAGGIO = 'daprod_dozer_v2';
const stato = {
  premi: 30,          // valuta del negozio: si vince quando le lire cadono dal bordo
  gettoni: 12,        // caricatore: gettoni da lanciare, si ricarica sempre (infiniti)
  vinte: 0,
  totVinte: 0,
  totLanci: 0,
  totTorri: 0,
  comboMax: 0,
  pot: { idle: 0, forza: 0, multi: 0, cannonePot: 0, raffica: 0, taglio: 1 },
  attivi: { cannone: true, raffica: false, audio: true },   // solo Cannone/Raffica: uno per volta
  audio: true,
  torreRecord: 1,
  sbloccati: { cannone: false, feltro: 'verde' },
  feltriPosseduti: ['verde'],
  ts: Date.now()
};
function caricaPartita() {
  try {
    const r = JSON.parse(localStorage.getItem(CHIAVE_SALVATAGGIO) || 'null');
    if (r && typeof r === 'object') {
      Object.assign(stato, r);
      stato.pot = Object.assign({ idle: 0, forza: 0, multi: 0, cannonePot: 0, raffica: 0, taglio: 1 }, r.pot);
      stato.attivi = Object.assign({ cannone: true, raffica: false }, r.attivi);
      if (stato.attivi.cannone && stato.attivi.raffica) stato.attivi.raffica = false; // uno solo alla volta
      stato.audio = r.audio !== false;
      if (typeof r.gettoni === 'number') stato.gettoni = r.gettoni; // salvato compatibile
      if (typeof r.torreRecord === 'number') stato.torreRecord = r.torreRecord;
      stato.sbloccati = Object.assign({ cannone: false, feltro: 'verde' }, r.sbloccati);
      stato.feltriPosseduti = Array.isArray(r.feltriPosseduti) ? r.feltriPosseduti : ['verde'];
    }
  } catch (e) { /* salvataggio corrotto: riparte pulito */ }
}
function salvaPartita() {
  try { localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify(stato)); } catch (e) {}

caricaPartita();

// --- formule di gioco (costi e potenza) ---
// GETTONI INFINITI: il caricatore si ricarica SEMPRE (mai blocchi di gioco)
const LIVELLI_MAX = { idle: 15, forza: 8, multi: 4, cannonePot: 8, raffica: 6 };
const COSTO_CANNONE = 300;
const COSTO_RAFFICA = 450;
const costoIdle = (n) => Math.round(30 * Math.pow(2.15, n));
const costoForza = (n) => Math.round(60 * Math.pow(2.0, n));
const costoMulti = (n) => Math.round(140 * Math.pow(3.3, n));
const costoCannonePot = (n) => Math.round(420 * Math.pow(2.2, n));
const costoRaffica = (n) => (n <= 0 ? COSTO_RAFFICA : Math.round(COSTO_RAFFICA * Math.pow(2.3, n)));
const rateRaffica = (n) => (n <= 0 ? 0 : 3 + 2 * n);      // lire al secondo a raffica
const capCaricatore = (n) => 16 + 4 * n;                  // gettoni trasportabili nel caricatore
const ricaricaGettoni = (n) => 1.2 + 0.55 * n;            // gettoni al secondo, sempre attivi
const costoTaglio = (n) => (n <= 1 ? 900 : 6000);         // passaggio a L.500 e L.1000
const nomeTaglio = (n) => TAGLI[Math.max(0, Math.min(TAGLI.length - 1, n))].nome;
const fattoreForza = (n) => 1 + 0.25 * n;                 // moltiplicatore della spinta di lancio
const lirePerLancio = (n) => 1 + n;                       // lire lanciate per click
const forzaCannone = (n) => 1 + 0.5 * n;                  // potenza dello sparo
const VERSIONE = 'v1.3.2';                                // mostrata nell'HUD per verificare gli aggiornamenti
const COSTO_FELTRO = { blu: 250, bordeaux: 700, notte: 1500 };
const NOME_FELTRO = { verde: 'Verde DaProd', blu: 'Blu Royal', bordeaux: 'Bordeaux', notte: 'Notte Neon' };

const suono = {
  lancio() { soffio(0.07, 2400, 0.07, 2.5); },
  atterra(vel) {
    const v = Math.min(1, Math.abs(vel) / 6);
    soffio(0.05, 1700 + v * 2200, 0.05 + v * 0.09, 3);

  },
  vinci(n) {
    const b = 640 * Math.pow(1.055, Math.min(22, n));
    nota(b, 0.16, 'triangle', 0.12);
    nota(b * 1.5, 0.22, 'sine', 0.09, 0.07);
  },
  torre() { [880, 1320, 1760].forEach((f, i) => nota(f, 0.22, 'sine', 0.11, i * 0.09)); },
  compra() { nota(1180, 0.09, 'square', 0.07); nota(1580, 0.14, 'square', 0.06, 0.08); },
  errore() { nota(150, 0.22, 'sawtooth', 0.08); },
  cannone() { soffio(0.32, 420, 0.2, 0.7); nota(110, 0.4, 'sawtooth', 0.09); },
  sblocco() { [523, 659, 784, 1046].forEach((f, i) => nota(f, 0.36, 'sine', 0.11, i * 0.11)); }
};

// ============ TEXTURE (disegnate su canvas, marchio DaProd) ============
function texCanvas(lato, disegna) {
  const c = document.createElement('canvas');
  c.width = c.height = lato;
  disegna(c.getContext('2d'), lato);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// faccia della lira: corona dorata + scritta DaProd
const texFaccia = texCanvas(256, (g, s) => {
  const r = s / 2;
  const grad = g.createRadialGradient(r * 0.75, r * 0.62, r * 0.1, r, r, r);
  grad.addColorStop(0, '#fff6c9'); grad.addColorStop(0.45, '#ffd54a');
  grad.addColorStop(0.8, '#d99b12'); grad.addColorStop(1, '#8a5f08');
  g.fillStyle = grad; g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 6;
  g.beginPath(); g.arc(r, r, r * 0.9, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = 'rgba(120,80,0,.55)'; g.lineWidth = 3;
  g.beginPath(); g.arc(r, r, r * 0.78, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(90,60,0,.85)';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  // monetina "Lira DaProd": marchio sopra, taglio al centro, valuta sotto
  g.font = '900 32px -apple-system, Segoe UI, sans-serif';
  g.fillText('DaProd', r, r - 66);
  g.font = '900 58px -apple-system, Segoe UI, sans-serif';
  g.fillText('L. 100', r, r - 6);
  g.font = '800 30px -apple-system, Segoe UI, sans-serif';
  g.fillText('LIRE', r, r + 52);
  g.font = '900 26px -apple-system, Segoe UI, sans-serif';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    g.fillText('·', r + Math.cos(a) * r * 0.68, r + Math.sin(a) * r * 0.68);
  }
});

// bordo rigato della lira
const texBordo = texCanvas(256, (g, s) => {
  g.fillStyle = '#c98f10'; g.fillRect(0, 0, s, s);
  for (let x = 0; x < s; x += 6) {
    g.fillStyle = x % 12 === 0 ? 'rgba(255,240,180,.85)' : 'rgba(120,80,0,.5)';

// zona di lancio: bordo tratteggiato + strisce diagonali + scritta

  g.beginPath(); g.roundRect(10, 10, s - 20, s - 20, 46); g.stroke();
  g.setLineDash([]);
  g.fillStyle = 'rgba(200,255,235,.85)';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 40px -apple-system, Segoe UI, sans-serif';

});

// logo inciso sul feltro
const texLogoFeltro = texCanvas(512, (g, s) => {

});

// scintilla per le particelle

// ============ GEOMETRIE ARROTONDATE ============
// rettangolo estruso con spigoli arrotondati; la faccia superiore sta su y = 0
function geoArrotondata(larg, prof, spess, raggio) {
  const s = new THREE.Shape();
  const w = larg / 2 - raggio, d = prof / 2 - raggio;
  s.moveTo(-w - raggio, -d);
  s.lineTo(-w - raggio, d);
  s.quadraticCurveTo(-w - raggio, d + raggio, -w, d + raggio);
  s.lineTo(w, d + raggio);
  s.quadraticCurveTo(w + raggio, d + raggio, w + raggio, d);
  s.lineTo(w + raggio, -d);
  s.quadraticCurveTo(w + raggio, -d - raggio, w, -d - raggio);
  s.lineTo(-w, -d - raggio);
  s.quadraticCurveTo(-w - raggio, -d - raggio, -w - raggio, -d);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: spess, bevelEnabled: false, curveSegments: 8, steps: 1
  });
  g.rotateX(-Math.PI / 2);
  g.translate(0, -spess, 0); // la faccia superiore resta su y = 0
  g.computeVertexNormals();
  return g;
}

// ============ SCENA ============

addEventListener('resize', () => {

});

// Zoom con rotella
let cameraZoom = 1;
addEventListener('wheel', (e) => {
  cameraZoom = Math.max(0.6, Math.min(1.4, cameraZoom - e.deltaY * 0.001));
}, { passive: true });

// In verticale (telefono) il tavolo non ci sta in larghezza: la camera arretra da sola
const fattoreVerticale = () => {
  const asp = innerWidth / innerHeight;
  if (asp >= 1.05) return 1;
  return 1 + (1.05 - asp) * 0.62;
};

// Zoom con due dita (pinch) sul telefono
const distanzaTocchi = (e) => {
  const t0 = e.touches[0], t1 = e.touches[1];
  return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
};
let pizzicaBase = null;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    inRaffica = false; accRaffica = 0; colpiRaffica = 0;    // il secondo dito è zoom, non fuoco
    if (inCarica) { inCarica = false; elCarica.classList.remove('attiva'); carica = 0; }
    pizzicaBase = distanzaTocchi(e) / cameraZoom;
  }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pizzicaBase) {
    cameraZoom = Math.max(0.55, Math.min(1.8, distanzaTocchi(e) / pizzicaBase));
    e.preventDefault();
  }
}, { passive: false });
renderer.domElement.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pizzicaBase = null;
}, { passive: true });

// faccia della lira disegnata su canvas, con la scritta del taglio
function creaFacciaLira(colore, scritta) {
  return texCanvas(256, (g, s) => {
    const r = s / 2;
    const c = new THREE.Color(colore);
    const chiaro = '#' + c.clone().offsetHSL(0, -0.15, 0.30).getHexString();
    const medio = '#' + c.getHexString();
    const scuro = '#' + c.clone().offsetHSL(0, 0.05, -0.34).getHexString();
    const grad = g.createRadialGradient(r * 0.72, r * 0.6, r * 0.1, r, r, r);
    grad.addColorStop(0, chiaro); grad.addColorStop(0.45, medio);
    grad.addColorStop(0.82, scuro); grad.addColorStop(1, scuro);
    g.fillStyle = grad; g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 6;
    g.beginPath(); g.arc(r, r, r * 0.9, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 3;
    g.beginPath(); g.arc(r, r, r * 0.78, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(20,14,4,.85)';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '900 30px -apple-system, Segoe UI, sans-serif';
    g.fillText('DaProd', r, r - 62);
    g.font = '900 62px -apple-system, Segoe UI, sans-serif';
    g.fillText(scritta, r, r - 2);
    g.font = '800 26px -apple-system, Segoe UI, sans-serif';
    g.fillText('L I R E', r, r + 54);
    g.font = '900 24px -apple-system, Segoe UI, sans-serif';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      g.fillText('·', r + Math.cos(a) * r * 0.68, r + Math.sin(a) * r * 0.68);
    }
  });
}

// geometrie e materiali di ogni taglio (in cache: si creano una volta sola)
const cacheTagli = {};
function taglio(i) {
  const t = TAGLI[Math.max(0, Math.min(TAGLI.length - 1, i))];
  if (cacheTagli[t.taglio]) return cacheTagli[t.taglio];
  const geo = new THREE.CylinderGeometry(t.r, t.r, t.h, 44, 1);
  const faccia = new THREE.MeshStandardMaterial({
    map: creaFacciaLira(t.colore, t.scritta), metalness: t.metalness,
    roughness: t.roughness, emissive: 0x140e04, emissiveIntensity: 0.5
  });
  const bordo = new THREE.MeshStandardMaterial({ map: texBordo, color: t.colore, metalness: t.metalness, roughness: t.roughness + 0.12 });
  const voce = Object.assign({}, t, { geo, mats: [bordo, faccia, faccia], indice: TAGLI.indexOf(t) });
  cacheTagli[t.taglio] = voce;
  return voce;
}
TAGLI.forEach((t, i) => taglio(i)); // prepara tutti i tagli all'avvio

// Le lire NASCONO SDRAIATE in una pila mista di tagli tra il bordo e la piastra
function creaLira(x, y, z, opz = {}) {
  const t = taglio(opz.taglio !== undefined ? opz.taglio : TAGLIO_PREDEFINITO);
  const mesh = new THREE.Mesh(t.geo, t.mats);
  mesh.position.set(x, y, z);
  mesh.rotation.y = Math.random() * Math.PI * 2; // solo rotazione su se stessa: la lira resta PIATTA
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  const inVolo = !!opz.volo;
  const m = {
    mesh,
    r: t.r, h: t.h,               // dimensioni del taglio (la fisica le usa una per una)
    taglio: t.taglio, premio: t.premio, colore: t.colore,
    vx: 0, vy: 0, vz: 0,
    rx: 0, rz: 0,       // inclinazione (deve tornare a 0 = sdraiata)
    wx: 0, wz: 0,       // capriole mentre vola
    aTerra: !inVolo,
    atterrata: !inVolo, // per far partire il suono solo all'atterraggio vero
    sotto: null,        // lira su cui poggia (serve per le torri)
    livello: 1,         // piano della torre (1 = a terra)
    torrePremiato: false, // bonus torre già assegnato
    proiettile: false,  // lira sparata dal cannone
    spinta: 0,          // potenza dell'impatto
    impulso: 0,         // impulso residuo da applicare
    pulse: 0,           // animazione di scala
    attiva: true
  };
  lire.push(m);
  return m;
}

// quante lire ci sono davvero sul tavolo (le attive)
function lireSulTavolo() {
  let n = 0;
  for (const m of lire) if (m.attiva) n++;

}
const tavoloPieno = () => lireSulTavolo() >= MAX_LIRE;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let ultimoLancio = 0;
let carica = 0;            // potenza di carica 0..1
let inCarica = false;
let inRaffica = false;     // tieni premuto: spara a raffica
let accRaffica = 0;        // accumulatore della raffica
let colpiRaffica = 0;      // quanti spari ha fatto la raffica in corso (per distinguere il tap)
let cooldownSparo = 0;     // secondi di ricarica del cannone
const COOLDOWN = 240;      // ms tra due lanci normali
const SPARO_MAX = 1.1;     // secondi per caricare al massimo

function aggiornaPuntatore(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObject(tavolo)[0];
  if (hit) {
    puntatore.x = hit.point.x;
    puntatore.z = hit.point.z;
    puntatore.visibile = true;
    puntatore.dentro = puntatore.x > ZONA.minX + 0.2 && puntatore.x < ZONA.maxX - 0.2 &&
                        puntatore.z > ZONA.minZ + 0.2 && puntatore.z < ZONA.maxZ - 0.2;
  } else {
    puntatore.visibile = false;
    puntatore.dentro = false;
  }
}

renderer.domElement.addEventListener('pointermove', aggiornaPuntatore);
renderer.domElement.addEventListener('pointerleave', () => { puntatore.visibile = false; });

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 && e.button !== 2) return;
  audioOn();
  aggiornaPuntatore(e);
  if (!puntatore.dentro) return;
  // Tasto destro (o tasto sinistro se la raffica è spenta): CANNONE
  const usaCannone = stato.attivi.cannone && stato.sbloccati.cannone && cooldownSparo <= 0 &&
    (e.button === 2 || !(stato.attivi.raffica && stato.pot.raffica > 0 && stato.gettoni >= 1));
  if (e.button === 2 || usaCannone) {
    if (usaCannone) {
      inCarica = true;
      carica = 0;
      elCarica.classList.add('attiva');
    }
    return;
  }
  // RAFFICA: tieni premuto il tasto sinistro e spara una lira dietro l'altra
  if (stato.attivi.raffica && stato.pot.raffica > 0 && stato.gettoni >= 1) {
    inRaffica = true;
    accRaffica = 0;
    colpiRaffica = 0;
  }
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.button !== 0 && e.button !== 2) return;
  if (e.button === 2) {
    if (inCarica) {
      inCarica = false;
      elCarica.classList.remove('attiva');
      const potenza = carica;
      carica = 0;
      if (potenza > 0.12 && puntatore.dentro) sparaCannone(puntatore.x, puntatore.z, potenza);
    }
    return;
  }
  if (inRaffica) {
    // tap veloce senza colpi: vale come un lancio singolo (comodo su telefono)
    if (colpiRaffica === 0 && puntatore.dentro) lanciaDalPuntatore();
    inRaffica = false;
    accRaffica = 0;
    colpiRaffica = 0;
    return;
  }
  if (inCarica) {
    inCarica = false;
    elCarica.classList.remove('attiva');
    const potenza = carica;
    carica = 0;
    if (potenza > 0.12 && puntatore.dentro) sparaCannone(puntatore.x, puntatore.z, potenza);
    return;
  }
  lanciaDalPuntatore();
});

// lancio normale delle lire (multi-lancio passivo: sempre attivo)
function lanciaDalPuntatore(daRaffica = false) {
  if (!puntatore.visibile || !puntatore.dentro) {
    if (!daRaffica) { suono.errore(); avviso('Lancia dentro la zona illuminata'); }
    return;
  }
  const ora = performance.now();
  if (!daRaffica && ora - ultimoLancio < COOLDOWN) return;
  if (tavoloPieno()) {                       // NESSUNA spazzata: si aspetta che il bordo si svuoti
    inRaffica = false;
    if (!daRaffica) { suono.errore(); avviso('TAVOLO PIENO — il bordo si sta svuotando 🕐'); }
    return;
  }
  const n = Math.min(lirePerLancio(stato.pot.multi), Math.floor(stato.gettoni));
  if (n <= 0) {
    if (!daRaffica) { suono.errore(); avviso('CARICATORE IN RICARICA…'); }
    inRaffica = false;
    return;
  }
  const spargi = daRaffica ? 0.35 : 0.55;
  for (let i = 0; i < n; i++) {
    const m = lanciaLira(puntatore.x + (Math.random() - 0.5) * spargi, puntatore.z + (Math.random() - 0.5) * spargi);
    m.spinta = 0.25 * stato.pot.forza;        // FORZA: abilità passiva
  }
  stato.gettoni -= n;
  stato.totLanci += n;
  ultimoLancio = ora;
  if (!daRaffica) suono.lancio();
  aggiornaHUD();
  salvaPartita();
}

// sparo del cannone: lira pesante che travolge la pila (costa 1 gettone)
function sparaCannone(x, z, potenza) {
  if (stato.gettoni < 1) { suono.errore(); avviso('CARICATORE IN RICARICA…'); return; }
  if (tavoloPieno()) { suono.errore(); avviso('TAVOLO PIENO — il bordo si sta svuotando '); return; }
  stato.gettoni -= 1;
  stato.totLanci += 1;
  const m = lanciaLira(x, z, true);
  m.proiettile = true;
  m.spinta = forzaCannone(stato.pot.cannonePot) * (0.7 + potenza);
  m.vy = -6 - 12 * potenza;
  cooldownSparo = 2.6;
  suono.cannone();
  scossa(0.5 + 0.6 * potenza);
  particelle(x, 0.4, z, 14, 0xffc857, 1.4);
  avviso('CANNONE ' + Math.round(potenza * 100) + '%');
  aggiornaHUD();
  salvaPartita();
}

function lanciaLira(x, z, proiettile = false) {
  // la lira lanciata è del TAGLIO scelto (potenziamento TAGLIO); il cannone usa un taglio più grande
  const indice = proiettile ? Math.min(TAGLI.length - 1, stato.pot.taglio + 1) : stato.pot.taglio;
  const m = creaLira(x, proiettile ? 7.6 : 6, z, { volo: true, taglio: indice });
  m.vx = (Math.random() - 0.5) * 0.4;
  m.vy = -1; // solo verso il basso, mai verso l'alto
  m.vz = (Math.random() - 0.5) * 0.4;
  m.rx = (Math.random() - 0.5) * 0.4;
  m.rz = (Math.random() - 0.5) * 0.4;
  m.wx = (Math.random() - 0.5) * 1.2;
  m.wz = (Math.random() - 0.5) * 1.2;
  return m;
}

// ============ FISICA ============
const G = 14;               // gravità (solo verso il basso)
const AIR_DRAG = 0.2;       // attrito aria
const GROUND_FRICTION = 8;  // forte attrito sul tavolo: la pila resta ferma se non è spinta
const V_MAX = 8;

function aggiornaFisica(dt) {
  // --- Piastra: avanti e indietro, lentamente ---
  pusherZ += pusherDir * PUSHER_SPEED * dt;
  if (pusherZ > PUSHER_MAX) { pusherZ = PUSHER_MAX; pusherDir = -1; }
  if (pusherZ < PUSHER_MIN) { pusherZ = PUSHER_MIN; pusherDir = 1; }
  pusherVel = pusherDir * PUSHER_SPEED;
  pusher.position.z = pusherZ;

  const halfD = PLATE_D / 2;
  const face = pusherZ - halfD; // faccia anteriore della piastra

  // 2 sotto-passi per collisioni più stabili
  const sub = 2;
  const h = dt / sub;

  for (let s = 0; s < sub; s++) {

    // 1) integrazione del moto
    for (const m of lire) {
      if (!m.attiva) continue;
      m.vy -= G * h;
      const sp = Math.hypot(m.vx, m.vy, m.vz);
      if (sp > V_MAX) { const k = V_MAX / sp; m.vx *= k; m.vy *= k; m.vz *= k; }
      m.mesh.position.x += m.vx * h;
      m.mesh.position.y += m.vy * h;
      m.mesh.position.z += m.vz * h;
      m.rx += m.wx * h; // capriole solo mentre vola
      m.rz += m.wz * h;
    }

    // 2) supporto: quanto in alto può stare ogni lira (dal basso verso l'alto)
    const ordinate = lire.filter(m => m.attiva).sort((a, b) => a.mesh.position.y - b.mesh.position.y);
    for (let i = 0; i < ordinate.length; i++) {
      const m = ordinate[i];
      const p = m.mesh.position;
      let restY = m.h / 2;               // superficie del tavolo (ogni taglio ha il suo spessore)
      let appoggio = null;
      // sopra la piastra le lire viaggiano con lei
      if (Math.abs(p.x) < 3.95 && p.z > pusherZ - halfD && p.z < pusherZ + halfD) restY = 0.12 + m.h / 2;
      for (let j = 0; j < i; j++) {
        const o = ordinate[j];
        const oz = o.mesh.position.z;
        const rSup = (m.r + o.r) * 0.78;                      // ogni taglio ha il suo raggio
        if (p.z - oz >= rSup || oz - p.z >= rSup) continue;    // scarto rapido
        const dx = p.x - o.mesh.position.x, dz = p.z - oz;
        if (dx * dx + dz * dz < rSup * rSup) {
          if (o.livello >= LIVELLI_TORRE_MAX) continue;        // tetto della torre: 30 piani
          const top = o.mesh.position.y + o.h;
          if (top > restY) { restY = top; appoggio = o; }
        }
      }
      // oltre il bordo anteriore: niente più supporto, la lira cade giù
      if (p.z < -5) restY = -100;
      m.sotto = appoggio;
      m.livello = appoggio ? appoggio.livello + 1 : 1;         // piano della torre

      if (p.y <= restY) {
        p.y = restY;
        if (m.vy < 0) m.vy = 0; // NESSUN rimbalzo: si ferma e basta
        m.aTerra = true;
        if (!m.atterrata) { m.atterrata = true; suAtterraggio(m); } // suono ed effetti all'atterraggio
        // --- TORRI (abilità passiva): extra dal 4° piano in su, una volta per lira ---
        if (m.livello >= 4 && !m.torrePremiato) { m.torrePremiato = true; suTorre(p, m.livello); }
      } else {
        m.aTerra = false;
      }
    }

    // 3) comportamento a contatto + piastra + sponde
    for (const m of lire) {
      if (!m.attiva) continue;
      const p = m.mesh.position;

      if (m.aTerra) {
        // la lira si assesta SDRAIATA (piatta)
        const att = Math.exp(-9 * h);
        m.rx *= att; m.rz *= att;
        m.wx = 0; m.wz = 0;
        // attrito forte: la pila non scivola da sola
        const fr = Math.exp(-GROUND_FRICTION * h);
        m.vx *= fr; m.vz *= fr;
        if (Math.hypot(m.vx, m.vz) < 0.02) { m.vx = 0; m.vz = 0; }
        // TORRI: la lira si centra su quella che ha sotto (pile ordinate e soddisfacenti)
        if (m.sotto && m.sotto.attiva) {
          const k = Math.min(1, 6 * h);
          p.x += (m.sotto.mesh.position.x - p.x) * k;
          p.z += (m.sotto.mesh.position.z - p.z) * k;
        }
      } else {
        const fr = Math.exp(-AIR_DRAG * h);
        m.vx *= fr; m.vz *= fr;
      }

      // Piastra: TRASPORTA le lire che poggiano sopra, SPINGE la pila davanti a sé
      const sopraPiastra = p.y > 0.10 && p.y < 1.10 &&
        Math.abs(p.x) < 3.95 && p.z > pusherZ - halfD && p.z < pusherZ + halfD;
      if (sopraPiastra) {
        p.z += pusherVel * h;
        m.vz = pusherVel;
      } else if (pusherVel < 0 && p.y < 0.12 &&
                 p.z > face - m.r && p.z < pusherZ + halfD) {
        // la faccia spinge la pila lentamente in avanti
        p.z = face - m.r;
        m.vz = Math.min(m.vz, pusherVel);
      }

      // Sponde
      if (p.x < -3.9) { p.x = -3.9; m.vx = Math.abs(m.vx) * 0.4; }
      if (p.x >  3.9) { p.x =  3.9; m.vx = -Math.abs(m.vx) * 0.4; }
      if (p.z >  4.9) { p.z =  4.9; m.vz = -Math.abs(m.vz) * 0.4; }
    }

    // 4) collisione lira-lira (solo a pari altezza: chi sta sopra non viene spinto di lato)
    for (let i = 0; i < lire.length; i++) {
      const a = lire[i];
      if (!a.attiva) continue;
      const az = a.mesh.position.z, ay = a.mesh.position.y, ax = a.mesh.position.x;
      for (let j = i + 1; j < lire.length; j++) {
        const b = lire[j];
        if (!b.attiva) continue;
        const bz = b.mesh.position.z;
        const minD = (a.r + b.r) * 0.98;                  // ogni taglio ha il suo diametro
        if (az - bz >= minD || bz - az >= minD) continue; // scarto rapido (la maggior parte delle coppie)
        if (Math.abs(ay - b.mesh.position.y) > (a.h + b.h) * 0.34) continue;
        const dx = ax - b.mesh.position.x;
        const dz = az - bz;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < minD && dist > 0.0001) {
          const nx = dx / dist, nz = dz / dist;
          const overlap = (minD - dist) / 2;
          a.mesh.position.x += nx * overlap; a.mesh.position.z += nz * overlap;
          b.mesh.position.x -= nx * overlap; b.mesh.position.z -= nz * overlap;
          const rvn = (a.vx - b.vx) * nx + (a.vz - b.vz) * nz;
          if (rvn < 0) {
            const imp = rvn * 0.55;
            a.vx -= nx * imp; a.vz -= nz * imp;
            b.vx += nx * imp; b.vz += nz * imp;
          }
        }
      }
    }

    // 5) caduta dal bordo = lira vinta (paga il valore del taglio)
    for (let i = lire.length - 1; i >= 0; i--) {
      const m = lire[i];
      if (!m.attiva) continue;
      if (m.mesh.position.z < -5 && m.mesh.position.y < -1.2) {
        m.attiva = false;
        scene.remove(m.mesh);
        vinciLira(m);
      }
    }
  }

  // applica rotazioni, inclinazioni e animazioni alle mesh
  for (const m of lire) {
    if (!m.attiva) continue;
    m.mesh.rotation.x = m.rx;
    m.mesh.rotation.z = m.rz;
    if (m.pulse > 0) {
      m.pulse = Math.max(0, m.pulse - dt * 2.4);
      m.mesh.scale.setScalar(1 + m.pulse * 0.2);
    } else if (m.mesh.scale.x !== 1) {
      m.mesh.scale.setScalar(1);
    }
  }
}

// ============ VINCITE, COMBO, TORRI, ATTERRAGGI ============
let combo = 0, comboScadenza = 0;
const elCombo = document.getElementById('combo');

function mostraCombo(n) {
  elCombo.textContent = 'COMBO x' + n;
  elCombo.classList.remove('mostra');
  void elCombo.offsetWidth;
  elCombo.classList.add('mostra');
}

// una lira è caduta dal bordo: paga, suona, festeggia
function vinciLira(m) {
  const pos = m.mesh.position;
  const ora = performance.now();
  combo = (ora - comboScadenza < 2600) ? combo + 1 : 1;
  comboScadenza = ora + 2600;
  stato.comboMax = Math.max(stato.comboMax, combo);
  // il valore dipende dal TAGLIO della lira vinta (50→1, 100→2, 500→5, 1000→10)
  const guadagno = (m.premio || 1) + Math.floor(combo / 5);
  stato.premi += guadagno;
  stato.vinte += 1;
  stato.totVinte += 1;
  if (combo >= 3) mostraCombo(combo);
  testoVolante(pos.x, 0.3, -4.6, '+' + guadagno + (m.taglio >= 500 ? ' 💎' : '') + (guadagno > (m.premio || 1) ? ' COMBO' : ''),
    m.taglio >= 500 ? 'bonus' : '');
  particelle(pos.x, 0.2, -4.9, 6 + Math.min(12, combo) + (m.taglio >= 500 ? 8 : 0), m.colore || 0xffd54a, 0.9);
  suono.vinci(combo);
  if (combo >= 5) {
    const lampo = document.createElement('div');
    lampo.className = 'lampo';
    document.body.appendChild(lampo);
    setTimeout(() => lampo.remove(), 520);
    scossa(0.3);
  }
  aggiornaHUD();
}

// torre di lire completata: il bonus cresce con il piano raggiunto (fino a 30)
function suTorre(p, livello) {
  const bonus = 1 + Math.floor(livello / 5) + (livello >= 20 ? 3 : 0);
  stato.premi += bonus;
  stato.totTorri += 1;
  const record = Math.max(stato.torreRecord || 1, livello);
  const nuovoRecord = livello > (stato.torreRecord || 1);
  stato.torreRecord = record;
  testoVolante(p.x, p.y + 0.4, p.z, 'TORRE x' + livello + '  +' + bonus + (nuovoRecord ? '  NUOVO RECORD!' : ''), 'torre');
  particelle(p.x, p.y, p.z, 10 + livello * 2, 0x7ef0c0, 1 + livello * 0.03);
  suono.torre();
  if (livello >= 10) {                 // torre importante: festa
    const lampo = document.createElement('div');
    lampo.className = 'lampo';
    document.body.appendChild(lampo);
    setTimeout(() => lampo.remove(), 520);
    scossa(0.25 + livello * 0.02);
  }
  aggiornaHUD();
  // tutte le lire della torre pulsano
  for (const q of lire) {
    if (!q.attiva) continue;
    if (Math.abs(q.mesh.position.x - p.x) < 0.3 && Math.abs(q.mesh.position.z - p.z) < 0.3) q.pulse = 1;
  }
}

// atterraggio: suono, scintille e (se la lira ha spinta) colpo che spazza la pila
function suAtterraggio(m) {
  const p = m.mesh.position;
  suono.atterra(m.vy);
  particelle(p.x, Math.max(0.08, p.y - 0.06), p.z, 4, 0xffe9a8, 0.5);
  if (m.spinta > 0) {
    const spinta = m.spinta;
    for (const q of lire) {
      if (!q.attiva || q === m) continue;
      const dx = q.mesh.position.x - p.x, dz = q.mesh.position.z - p.z;
      const d2 = dx * dx + dz * dz;
      if (d2 > 4.6) continue;
      const d = Math.max(0.25, Math.sqrt(d2));
      const k = (1 - d / 2.15) * 3.2 * spinta;
      q.vz -= k;                          // spinta verso il bordo di caduta
      q.vx += (dx / d) * k * 0.5;
      q.vy = Math.max(q.vy, Math.min(0.9, 0.22 * spinta)); // piccolo sobbalzo, mai salti alti
      q.pulse = 0.8;
    }
    particelle(p.x, 0.45, p.z, m.proiettile ? 22 : 10, 0xffb03a, 1.4);
    scossa(m.proiettile ? 0.7 + 0.4 * spinta : 0.2 * spinta);
  }
}

// ============ EFFETTI (particelle, testi volanti, scossa) ============
const gruppoParticelle = new THREE.Group();
scene.add(gruppoParticelle);
const poolParticelle = [];
const PARTICELLE_MAX = 240;
function creaParticella() {
  const mat = new THREE.SpriteMaterial({
    map: texScintilla, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const s = new THREE.Sprite(mat);
  s.visible = false;
  gruppoParticelle.add(s);
  const p = { sprite: s, vita: 0, vitaMax: 1, vx: 0, vy: 0, vz: 0, taglia: 0.4 };
  poolParticelle.push(p);
  return p;
}
function particelle(x, y, z, quante, colore = 0xffd54a, forza = 1) {
  for (let i = 0; i < quante; i++) {
    let p = poolParticelle.find(q => q.vita <= 0);
    if (!p) {
      if (poolParticelle.length >= PARTICELLE_MAX) return;
      p = creaParticella();
    }
    p.vita = p.vitaMax = 0.5 + Math.random() * 0.45;
    p.vx = (Math.random() - 0.5) * 2.4 * forza;
    p.vz = (Math.random() - 0.5) * 2.4 * forza;
    p.vy = 1.1 + Math.random() * 2.2 * forza;
    p.taglia = 0.2 + Math.random() * 0.3;
    p.sprite.visible = true;
    p.sprite.material.color.setHex(colore);
    p.sprite.position.set(x, y, z);
    p.sprite.scale.setScalar(p.taglia);
  }
}
function aggiornaParticelle(dt) {
  for (const p of poolParticelle) {
    if (p.vita <= 0) continue;
    p.vita -= dt;
    if (p.vita <= 0) { p.sprite.visible = false; continue; }
    p.vy -= 6 * dt;
    p.sprite.position.x += p.vx * dt;
    p.sprite.position.y += p.vy * dt;
    p.sprite.position.z += p.vz * dt;
    const k = p.vita / p.vitaMax;
    p.sprite.material.opacity = k;
    p.sprite.scale.setScalar(p.taglia * (0.5 + k * 0.9));
  }
}

// testi volanti in HTML, proiettati dal mondo 3D
const contenitoreFloater = document.getElementById('floaters');
function proietta(x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(camera);
  return { sx: (v.x * 0.5 + 0.5) * innerWidth, sy: (-v.y * 0.5 + 0.5) * innerHeight };
}
function testoVolante(x, y, z, testo, classe = '') {
  const { sx, sy } = proietta(x, y, z);
  if (!isFinite(sx) || !isFinite(sy)) return;
  if (sx < -100 || sx > innerWidth + 100 || sy < -100 || sy > innerHeight + 100) return;
  const d = document.createElement('div');
  d.className = 'floater ' + classe;
  d.textContent = testo;
  d.style.left = sx + 'px';
  d.style.top = sy + 'px';
  contenitoreFloater.appendChild(d);
  setTimeout(() => d.remove(), 1100);
}
function avviso(testo) {
  testoVolante(0, 0.5, 1, testo, 'bonus');
}

// ============ ABILITÀ ATTIVE (interruttori ON/OFF) ============
// Solo due: CANNONE e RAFFICA. Una esclude l'altra. FORZA, GETTONI e TORRI sono PASSIVE.
const chipAbilita = [
  { id: 'cannone', sbloccata: () => stato.sbloccati.cannone, nota: () => 'carica dx' },
  { id: 'raffica', sbloccata: () => stato.pot.raffica > 0, nota: () => rateRaffica(stato.pot.raffica).toFixed(0) + '/s' },
  { id: 'audio', sbloccata: () => true, nota: () => (stato.audio ? 'ON' : 'OFF') }
];
const PASSIVE = [
  { nome: '💪 FORZA DI LANCIO', valore: () => 'x' + fmt(fattoreForza(stato.pot.forza)), desc: 'Ogni lira lanciata colpisce la pila e la spinge verso il bordo.' },
  { nome: '✨ MULTI-LANCIO', valore: () => lirePerLancio(stato.pot.multi) + ' lire', desc: 'Più lire per click: si compra e resta sempre attiva.' },
  { nome: '🪙 RICARICA GETTONI', valore: () => fmt(ricaricaGettoni(stato.pot.idle)) + '/s', desc: 'Il caricatore si riempie da solo: i gettoni sono infiniti.' },
  { nome: '🏗️ TORRI DI LIRE', valore: () => 'record x' + (stato.torreRecord || 1), desc: 'Bonus automatico dal 4° piano fino a 30 piani.' }
];
function aggiornaAbilita() {
  for (const c of chipAbilita) {
    const el = document.getElementById('ch-' + c.id);
    if (!el) continue;
    const sbloccata = c.sbloccata();
    const acceso = c.id === 'audio' ? stato.audio : (sbloccata && !!stato.attivi[c.id]);
    el.classList.toggle('bloccata', !sbloccata);
    el.classList.toggle('on', acceso);
    el.classList.toggle('off', !acceso);
    if ('disabled' in el) el.disabled = !sbloccata;
    const piccolo = el.querySelector ? el.querySelector('small') : null;
    if (piccolo) piccolo.textContent = sbloccata ? c.nota() : 'bloccata';
  }
  if (typeof aggiornaSpara === 'function') aggiornaSpara();
}
function cambiaAbilita(id) {
  if (id === 'audio') {
    stato.audio = !stato.audio;
  } else {
    const c = chipAbilita.find(q => q.id === id);
    if (!c || !c.sbloccata()) { suono.errore(); avviso('Prima sbloccalo nel negozio'); return; }
    const acceso = !stato.attivi[id];
    // CANNONE e RAFFICA si escludono a vicenda
    stato.attivi.cannone = false;
    stato.attivi.raffica = false;
    stato.attivi[id] = acceso;
    if (!acceso) stato.attivi.cannone = true;   // se spengo tutto, resta attivo il cannone
    if (id === 'raffica' || !stato.attivi.raffica) { inRaffica = false; accRaffica = 0; colpiRaffica = 0; }
    if (inCarica) { inCarica = false; elCarica.classList.remove('attiva'); carica = 0; }
  }
  suono.compra();
  aggiornaAbilita();
  aggiornaHUD();
  rendiNegozio();
  salvaPartita();
}
function collegaAbilita() {
  for (const c of chipAbilita) {
    const el = document.getElementById('ch-' + c.id);
    if (!el) continue;
    el.onclick = () => cambiaAbilita(c.id);
    el.addEventListener('touchend', (e) => { e.preventDefault(); cambiaAbilita(c.id); }, { passive: false });
  }
  aggiornaAbilita();
}

function riga(o) {
  const massimo = !!o.max2;

  const accessibile = !massimo && !o.bloccato && manca === 0;
  const dis = (massimo || o.bloccato || manca > 0) ? 'disabled' : '';
  const etichetta = massimo ? (o.etichettaMax || ' MASSIMO')
    : (o.bloccato ? '🔒 BLOCCATO' : ' ' + o.costo);
  const sotto = massimo ? (o.sottoMax || 'attiva') : (o.bloccato ? 'nel negozio' : (manca > 0 ? 'mancano ' + manca : 'compra ora'));
  const prog = (o.lv !== undefined && o.max) ?
    '<div class="prog"><i style="width:' + Math.round(o.lv / o.max * 100) + '%"></i>' +
    '<span>LIVELLO ' + o.lv + ' / ' + o.max + '</span></div>' : '';
  const avvisoManca = (manca > 0 && !massimo) ?
    '<div class="lv manca">TI MANCANO ' + manca + ' PREMI 🏆</div>' : '';
  return '<div class="voce' + (massimo ? ' max' : '') + (accessibile ? ' ok' : '') + '">' +

}

        '<div class="lv">' + statoTesto + '</div></div>' +
        '<button class="inter' + (acceso ? ' acceso' : '') + '" data-ab="' + v.id + '"' + (v.sbloccata ? '' : ' disabled') + '>' +
        '<span class="pallino"></span>' + (acceso ? 'ON' : 'OFF') + '</button></div>';
    }).join('');
    html += '<div class="voce"><div class="riepilogo"><b>ABILITÀ PASSIVE</b> — sempre attive, non si spengono:<br><br>' +
      PASSIVE.map(v => v.nome + ' · <b>' + v.valore() + '</b><br><span style="opacity:.72">' + v.desc + '</span>').join('<br><br>') +
      '</div></div>';
  } else {
    html = '<div class="voce"><div class="riepilogo">' +
      'Lire vinte in totale: <b>' + stato.totVinte + '</b><br>' +
      'Lire lanciate: <b>' + stato.totLanci + '</b><br>' +
      'Torri costruite: <b>' + stato.totTorri + '</b> · record <b>x' + (stato.torreRecord || 1) + '/30</b><br>' +
      'Combo massima: <b>x' + stato.comboMax + '</b><br>' +
      'Taglio in uso: <b>' + nomeTaglio(p.taglio) + '</b><br>' +
      'Ricarica gettoni: <b>' + fmt(ricaricaGettoni(p.idle)) + '/s</b> (cap ' + capCaricatore(p.idle) + ')<br>' +
      'Premi attuali: <b>' + Math.floor(stato.premi) + '</b>' +
      '</div><button class="compra" data-id="azzera">AZZERA TUTTO</button></div>';
  }
  elVoci.innerHTML = html;
  elVoci.querySelectorAll('button.compra').forEach(b => { b.onclick = () => compra(b.dataset.id); });
  elVoci.querySelectorAll('button.inter').forEach(b => { b.onclick = () => cambiaAbilita(b.dataset.ab); });
  // su telefono i bottoni del negozio devono rispondere al tocco
  elVoci.querySelectorAll('button.compra, button.inter').forEach(b => {
    b.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (b.dataset.id) compra(b.dataset.id); else if (b.dataset.ab) cambiaAbilita(b.dataset.ab);
    }, { passive: false });
  });
}

function compra(id) {
  const p = stato.pot;
  const paga = (c) => {
    if (stato.premi < c) { suono.errore(); return false; }
    stato.premi -= c;
    return true;
  };
  if (id === 'idle' && p.idle < LIVELLI_MAX.idle) { if (paga(costoIdle(p.idle))) { p.idle++; suono.compra(); } }
  else if (id === 'forza' && p.forza < LIVELLI_MAX.forza) { if (paga(costoForza(p.forza))) { p.forza++; suono.compra(); } }
  else if (id === 'multi' && p.multi < LIVELLI_MAX.multi) { if (paga(costoMulti(p.multi))) { p.multi++; suono.compra(); } }
  else if (id === 'raffica' && p.raffica < LIVELLI_MAX.raffica) {
    if (paga(costoRaffica(p.raffica))) {
      p.raffica++;
      // appena comprata si attiva, spegnendo il cannone (una sola abilità attiva)
      stato.attivi.raffica = true;
      stato.attivi.cannone = false;
      if (p.raffica === 1) { suono.sblocco(); avviso('RAFFICA SBLOCCATA! ⚡'); }
      else suono.compra();
    }
  }
  else if (id === 'cannonePot' && stato.sbloccati.cannone && p.cannonePot < LIVELLI_MAX.cannonePot) {
    if (paga(costoCannonePot(p.cannonePot))) { p.cannonePot++; suono.compra(); }
  }
  else if (id === 'cannone' && !stato.sbloccati.cannone) {
    if (paga(COSTO_CANNONE)) {
      stato.sbloccati.cannone = true;
      // appena sbloccato si attiva, spegnendo la raffica (una sola abilità attiva)
      stato.attivi.cannone = true;
      stato.attivi.raffica = false;
      suono.sblocco();
      particelle(0, 0.6, 0, 34, 0xffd54a, 2);
      avviso('CANNONE SBLOCCATO! 💥');
    }
  }
  else if (id === 'taglio' && p.taglio < TAGLI.length - 1) {
    if (paga(costoTaglio(p.taglio))) {
      p.taglio++;
      aggiornaFantasma();
      suono.sblocco();
      avviso('NUOVO TAGLIO: ' + nomeTaglio(p.taglio).toUpperCase() + ' ');
      particelle(0, 1.2, 0, 30, taglio(p.taglio).colore, 1.8);
    }
  }
  else if (id.indexOf('feltro_') === 0) {
    const f = id.slice(7);
    const applica = () => { stato.sbloccati.feltro = f; tavoloMat.color.setHex(COLORE_FELTRI[f]); };
    if (stato.feltriPosseduti.includes(f)) { applica(); suono.compra(); }
    else if (paga(COSTO_FELTRO[f])) { stato.feltriPosseduti.push(f); applica(); suono.sblocco(); }
  }
  else if (id === 'azzera') {
    if (confirm('Azzerare saldo, potenziamenti e sbloccabili?')) {
      localStorage.removeItem(CHIAVE_SALVATAGGIO);
      location.reload();
    }
    return;
  }
  aggiornaHUD();
  aggiornaAbilita();
  salvaPartita();
  rendiNegozio();
}

// ============ LOOP ============
let lastTime = performance.now();
let tempoSalvataggio = 0;
let t = 0;
let sparaPronto = true;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  t += dt;

  aggiornaFisica(dt);
  aggiornaParticelle(dt);

  // --- GETTONI INFINITI: il caricatore si ricarica SEMPRE, senza interruttori che lo fermino ---
  const capG = capCaricatore(stato.pot.idle);
  if (stato.gettoni < capG) {
    stato.gettoni = Math.min(capG, stato.gettoni + ricaricaGettoni(stato.pot.idle) * dt);
    aggiornaHUD();
  } else if (stato.gettoni > capG) {
    stato.gettoni = capG;                      // potenziamento appena comprato: riempio fino al nuovo tetto
    aggiornaHUD();
  }

  // --- RAFFICA: tieni premuto e le lire partono una dietro l'altra ---
  if (inRaffica) {
    const rr = stato.attivi.raffica ? rateRaffica(stato.pot.raffica) : 0;
    if (rr <= 0 || stato.gettoni < 1 || !puntatore.dentro) {
      inRaffica = false;
      accRaffica = 0;
    } else {
      accRaffica += dt;
      const intervallo = 1 / rr;
      let giri = 0;
      while (accRaffica >= intervallo && giri < 4) { // max 4 lanci per frame
        accRaffica -= intervallo;
        lanciaDalPuntatore(true);
        colpiRaffica++;
        giri++;
      }
    }
  } else accRaffica = 0;

  // --- cannone: carica, ricarica, colore del mirino ---
  if (inCarica) {
    carica = Math.min(1, carica + dt / SPARO_MAX);
    elCaricaBar.style.width = (carica * 100).toFixed(0) + '%';
    elCaricaTxt.textContent = 'CANNONE ' + Math.round(carica * 100) + '%';
    mirinoMat.color.setHex(0xff9a3c);
    mirino.scale.setScalar(1 + carica * 0.6);
  } else {
    if (cooldownSparo > 0) cooldownSparo = Math.max(0, cooldownSparo - dt);
    mirino.scale.setScalar(1);
    mirinoMat.color.setHex(stato.sbloccati.cannone && cooldownSparo <= 0 ? 0x7ef0c0 : 0xffd54a);
  }
  if (TATTILE) { // il pulsante SPARA si aggiorna solo quando cambia stato
    const pronto = cooldownSparo <= 0 && stato.gettoni >= 1;
    if (pronto !== sparaPronto) { sparaPronto = pronto; aggiornaSpara(); }
  }

  // --- mirino e lira fantasma seguono il puntatore ---
  if (puntatore.visibile) {
    mirino.visible = true;
    mirino.position.x = puntatore.x;
    mirino.position.z = puntatore.z;
    mirinoMat.opacity = puntatore.dentro ? 0.95 : 0.3;
    liraFantasma.visible = puntatore.dentro;
    liraFantasma.position.set(puntatore.x, 1.5 + Math.sin(t * 2.6) * 0.2, puntatore.z);
    liraFantasma.rotation.y = t * 0.9;
  } else {
    mirino.visible = false;
    liraFantasma.visible = false;
  }

  // --- zona di lancio pulsante ---
  zonaMat.opacity = 0.34 + (Math.sin(t * 1.9) * 0.5 + 0.5) * 0.28;
  zonaMesh.scale.setScalar(1 + Math.sin(t * 1.9) * 0.005);

  // --- i bordi delle lire brillano di riflesso (taglio più alto = bordo più vivo) ---
  if (combo > 0 && now > comboScadenza) combo = 0;

  // --- camera: zoom (utente + arretramento in verticale) + scossa ---
  const kv = fattoreVerticale();
  const targetPos = new THREE.Vector3(0, 10 * kv * cameraZoom, -12 * kv * cameraZoom);
  camera.position.lerp(targetPos, 0.1);
  if (scossaForza > 0) {
    scossaForza = Math.max(0, scossaForza - dt * 2.6);
    camera.position.x += (Math.random() - 0.5) * scossaForza * 0.5;
    camera.position.y += (Math.random() - 0.5) * scossaForza * 0.4;
  }
  camera.lookAt(0, 0, 0);

  tempoSalvataggio += dt;
  if (tempoSalvataggio > 4) { tempoSalvataggio = 0; salvaPartita(); }

  renderer.render(scene, camera);
}

// ============ INTERFACCIA (negozio, audio, scorciatoie) ============
// sparo dal pulsante dedicato (telefono): parte già carico al massimo
const elSpara = document.getElementById('spara');
elSpara.onclick = () => {
  if (!stato.sbloccati.cannone || cooldownSparo > 0) { suono.errore(); return; }
  if (!puntatore.visibile || !puntatore.dentro) { suono.errore(); avviso('Tocca il tavolo per mirare'); return; }
  sparaCannone(puntatore.x, puntatore.z, 1);
};
function aggiornaSpara() {
  if (!elSpara) return;
  const mostralo = TATTILE && stato.sbloccati.cannone;
  elSpara.style.display = mostralo ? 'inline-flex' : 'none';
  if (mostralo) {
    elSpara.disabled = cooldownSparo > 0 || stato.gettoni < 1;
    elSpara.style.opacity = elSpara.disabled ? '.45' : '1';
  }
}
// ---------- apertura/chiusura negozio: funziona con mouse e con tocco ----------
function apriNegozio() {
  elNegozio.classList.remove('chiuso');
  rendiNegozio();
  suono.compra();
}
const elApriNegozio = document.getElementById('apriNegozio');
const elBoxPremi = document.getElementById('boxPremi');
let ultimaApertura = 0;
function apriNegozioSicuro(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const ora = performance.now();
  if (ora - ultimaApertura < 350) return;   // evita il doppio scatto click + touchend
  ultimaApertura = ora;
  apriNegozio();
}
for (const el of [elApriNegozio, elBoxPremi]) {
  if (!el) continue;
  el.addEventListener('click', apriNegozioSicuro);
  el.addEventListener('touchend', apriNegozioSicuro, { passive: false });
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') apriNegozioSicuro(e); });
}

document.getElementById('chiudiNegozio').onclick = () => elNegozio.classList.add('chiuso');
elNegozio.addEventListener('click', (e) => { if (e.target === elNegozio) elNegozio.classList.add('chiuso'); });
document.querySelectorAll('.tab button').forEach(b => {
  b.addEventListener('click', () => {
    schedaAttiva = b.dataset.tab;
    document.querySelectorAll('.tab button').forEach(q => q.classList.toggle('sel', q === b));
    rendiNegozio();
  });
  b.addEventListener('touchend', (e) => {
    e.preventDefault();
    schedaAttiva = b.dataset.tab;
    document.querySelectorAll('.tab button').forEach(q => q.classList.toggle('sel', q === b));
    rendiNegozio();
  }, { passive: false });
});
collegaAbilita();
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') elNegozio.classList.add('chiuso');
  if (e.key === 'b' || e.key === 'B') {
    elNegozio.classList.toggle('chiuso');
    if (!elNegozio.classList.contains('chiuso')) rendiNegozio();
    return;
  }
  // scorciatoie abilità: C cannone · R raffica · F forza · M multi · I idle · T torri · A audio
  const tasti = { c: 'cannone', r: 'raffica', f: 'forza', m: 'multi', i: 'idle', t: 'torri', a: 'audio' };
  const ab = tasti[e.key.toLowerCase()];
  if (ab) cambiaAbilita(ab);
});
addEventListener('beforeunload', salvaPartita);

// ============ AVVIO ============
tavoloMat.color.setHex(COLORE_FELTRI[stato.sbloccati.feltro] || COLORE_FELTRI.verde);
// il salvataggio può arrivare da versioni vecchie: riporto i valori nei limiti validi
stato.pot.taglio = Math.max(0, Math.min(TAGLI.length - 1, parseInt(stato.pot.taglio, 10) || 0));
stato.torreRecord = Math.max(1, parseInt(stato.torreRecord, 10) || 1);
const elVersione = document.getElementById('versione');
if (elVersione) elVersione.textContent = VERSIONE;
stato.gettoni = Math.min(Math.max(stato.gettoni, 0), capCaricatore(stato.pot.idle));
aggiornaFantasma();          // l'anteprima usa il taglio scelto
aggiornaHUD();
aggiornaAbilita();
aggiornaSpara();
rendiNegozio();
animate();
</script>
