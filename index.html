<script type="module">
import * as THREE from 'three';

// ============ AMBIENTE ============
// Telefono/tablet: niente tasto destro, quindi lo sparo ha un pulsante dedicato
const TATTILE = (typeof matchMedia === 'function') &&
  (matchMedia('(hover: none)').matches || matchMedia('(pointer: coarse)').matches);

// ============ SUONO (tutto sintetizzato, nessun file esterno) ============
let audioCtx = null;
function audioOn() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function nota(freq, dur, tipo = 'sine', vol = 0.15, ritardo = 0) {
  const c = audioOn(); if (!c || !stato.audio) return;
  const t = c.currentTime + ritardo;
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.99, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function soffio(dur, freq, vol = 0.2, q = 1.2) {
  const c = audioOn(); if (!c || !stato.audio) return;
  const n = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(c.destination); s.start();
}
// ============ STATO, ECONOMIA E SALVATAGGIO ============
const CHIAVE_SALVATAGGIO = 'daprod_dozer_v1';
const stato = {
  saldo: 30,
  vinte: 0,
  totVinte: 0,
  totLanci: 0,
  totTorri: 0,
  comboMax: 0,
  pot: { idle: 0, forza: 0, multi: 0, cannonePot: 0, raffica: 0 },
  attivi: { idle: true, forza: true, multi: true, cannone: true, raffica: true, torri: true },
  audio: true,
  sbloccati: { cannone: false, skin: 'oro', feltro: 'verde' },
  skinPossedute: ['oro'],
  feltriPosseduti: ['verde'],
  idleAcc: 0,
  ts: Date.now()
};
function caricaPartita() {
  try {
    const r = JSON.parse(localStorage.getItem(CHIAVE_SALVATAGGIO) || 'null');
    if (r && typeof r === 'object') {
      Object.assign(stato, r);
      stato.pot = Object.assign({ idle: 0, forza: 0, multi: 0, cannonePot: 0, raffica: 0 }, r.pot);
      stato.attivi = Object.assign(

function texCanvas(lato, disegna) {
  const c = document.createElement('canvas');
  c.width = c.height = lato;
  disegna(c.getContext('2d'), lato);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// ============ GEOMETRIE ARROTONDATE ============
// rettangolo estruso con spigoli arrotondati; la faccia superiore sta su y = 0
function geoArrotondata(larg, prof, spess, raggio) {
  const s = new THREE.Shape();
  const w = larg / 2 - raggio, d = prof / 2 - raggio;
  s.moveTo(-w - raggio, -d);
  s.lineTo(-w - raggio, d);
  s.quadraticCurveTo(-w - raggio, d + raggio, -w, d + raggio);
  s.lineTo(w, d + raggio);
  s.quadraticCurveTo(w + raggio, d + raggio, w + raggio, d);
  s.lineTo(w + raggio, -d);
  s.quadraticCurveTo(w + raggio, -d - raggio, w, -d - raggio);
  s.lineTo(-w, -d - raggio);
  s.quadraticCurveTo(-w - raggio, -d - raggio, -w - raggio, -d);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: spess, bevelEnabled: false, curveSegments: 8, steps: 1
  });
  g.rotateX(-Math.PI / 2);
  g.translate(0, -spess, 0); // la faccia superiore resta su y = 0
  g.computeVertexNormals();
  return g;
}

    wx: 0, wz: 0,       // capriole mentre vola
    aTerra: !inVolo,

    sotto: null,        // lira su cui poggia (serve per le torri)
    torre: 0,           // livello di torre al momento
    torrePremiato: false, // bonus torre già assegnato
    proiettile: false,  // lira sparata dal cannone
    spinta: 0,          // potenza dell'impatto
    impulso: 0,         // impulso residuo da applicare
    pulse: 0,           // animazione di scala
    attiva: true
  };
  lire.push(m);
  if (lire.length > MAX_LIRE) {
    const i = lire.findIndex(q => q.attiva && q !== m && q.aTerra);
    if (i >= 0) { lire[i].attiva = false; scene.remove(lire[i].mesh); }

  return m;
}

  }
}

renderer.domElement.addEventListener('pointermove', aggiornaPuntatore);
renderer.domElement.addEventListener('pointerleave', () => { puntatore.visibile = false; });

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 && e.button !== 2) return;
  audioOn();
  aggiornaPuntatore(e);
  if (!puntatore.dentro) return;
  // TAsto destro (o tasto sinistro se la raffica è spenta): CANNONE
  const usaCannone = stato.attivi.cannone && stato.sbloccati.cannone && cooldownSparo <= 0 &&
    (e.button === 2 || !(stato.attivi.raffica && stato.pot.raffica > 0 && stato.saldo > 0));
  if (e.button === 2 || usaCannone) {
    if (usaCannone) {
      inCarica = true;
      carica = 0;
      elCarica.classList.add('attiva');
    }
    return;
  }
  // RAFFICA: tieni premuto il tasto sinistro e spara una lira dietro l'altra
  if (stato.attivi.raffica && stato.pot.raffica > 0 && stato.saldo > 0) {
    inRaffica = true;
    accRaffica = 0;
    colpiRaffica = 0;
  }
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.button !== 0 && e.button !== 2) return;
  if (e.button === 2) {
    if (inCarica) {
      inCarica = false;
      elCarica.classList.remove('attiva');
      const potenza = carica;
      carica = 0;
      if (potenza > 0.12 && puntatore.dentro) sparaCannone(puntatore.x, puntatore.z, potenza);
    }
    return;
  }
  if (inRaffica) {
    // tap veloce senza colpi: vale come un lancio singolo (comodo su telefono)
    if (colpiRaffica === 0 && puntatore.dentro) lanciaDalPuntatore();
    inRaffica = false;
    accRaffica = 0;
    colpiRaffica = 0;
    return;
  }
  if (inCarica) {
    inCarica = false;
    elCarica.classList.remove('attiva');
    const potenza = carica;
    carica = 0;
    if (potenza > 0.12 && puntatore.dentro) sparaCannone(puntatore.x, puntatore.z, potenza);
    return;
  }
  lanciaDalPuntatore();
});

// niente menu contestuale: il tasto destro serve per il cannone
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// lancio normale delle lire (multi-lancio potenziabile)
function lanciaDalPuntatore(daRaffica = false) {
  if (!puntatore.visibile || !puntatore.dentro) {
    if (!daRaffica) { suono.errore(); avviso('Lancia dentro la zona illuminata'); }
    return;
  }
  const ora = performance.now();
  if (!daRaffica && ora - ultimoLancio < COOLDOWN) return;
  const nMulti = stato.attivi.multi ? lirePerLancio(stato.pot.multi) : 1;
  const n = Math.min(nMulti, stato.saldo);
  if (n <= 0) {
    if (!daRaffica) { suono.errore(); avviso('SALDO ESAURITO'); }
    inRaffica = false;
    return;
  }
  const spargi = daRaffica ? 0.35 : 0.55;
  for (let i = 0; i < n; i++) {
    const m = lanciaLira(puntatore.x + (Math.random() - 0.5) * spargi, puntatore.z + (Math.random() - 0.5) * spargi);
    // potenziamento FORZA DI LANCIO (se attivo): la lira colpisce la pila
    m.spinta = (stato.attivi.forza ? 0.25 * stato.pot.forza : 0);
  }
  stato.saldo -= n;
  stato.totLanci += n;
  ultimoLancio = ora;
  if (!daRaffica) suono.lancio();
  aggiornaHUD();
  salvaPartita();
}

// sparo del cannone: lira pesante che travolge la pila
function sparaCannone(x, z, potenza) {
  if (stato.saldo <= 0) { suono.errore(); avviso('SALDO ESAURITO'); return; }
  stato.saldo -= 1;
  stato.totLanci += 1;
  const m = lanciaLira(x, z, true);
  m.proiettile = true;
  m.spinta = forzaCannone(stato.pot.cannonePot) * (0.7 + potenza);
  m.vy = -6 - 12 * potenza;
  cooldownSparo = 2.6;
  suono.cannone();
  scossa(0.5 + 0.6 * potenza);
  particelle(x, 0.4, z, 14, 0xffc857, 1.4);
  avviso('CANNONE ' + Math.round(potenza * 100) + '%');
  aggiornaHUD();
  salvaPartita();
}

function lanciaLira(x, z, proiettile = false) {
  const m = creaLira(x, proiettile ? 7.6 : 6, z, { volo: true });
  m.vx = (Math.random() - 0.5) * 0.4;
  m.vy = -1; // solo verso il basso, mai verso l'alto
  m.vz = (Math.random() - 0.5) * 0.4;
  m.rx = (Math.random() - 0.5) * 0.4;
  m.rz = (Math.random() - 0.5) * 0.4;
  m.wx = (Math.random() - 0.5) * 1.2;
  m.wz = (Math.random() - 0.5) * 1.2;
  return m;
}

// ============ FISICA ============
const G = 14;               // gravità (solo verso il basso)
const AIR_DRAG = 0.2;       // attrito aria
const GROUND_FRICTION = 8;  // forte attrito sul tavolo: la pila resta ferma se non è spinta
const V_MAX = 8;

function aggiornaFisica(dt) {
  // --- Piastra: avanti e indietro, lentamente ---
  pusherZ += pusherDir * PUSHER_SPEED * dt;
  if (pusherZ > PUSHER_MAX) { pusherZ = PUSHER_MAX; pusherDir = -1; }
  if (pusherZ < PUSHER_MIN) { pusherZ = PUSHER_MIN; pusherDir = 1; }
  pusherVel = pusherDir * PUSHER_SPEED;
  pusher.position.z = pusherZ;

  const halfD = PLATE_D / 2;
  const face = pusherZ - halfD; // faccia anteriore della piastra

  // 2 sotto-passi per collisioni più stabili
  const sub = 2;
  const h = dt / sub;

  for (let s = 0; s < sub; s++) {

    // 1) integrazione del moto
    for (const m of lire) {
      if (!m.attiva) continue;
      m.vy -= G * h;
      const sp = Math.hypot(m.vx, m.vy, m.vz);
      if (sp > V_MAX) { const k = V_MAX / sp; m.vx *= k; m.vy *= k; m.vz *= k; }
      m.mesh.position.x += m.vx * h;
      m.mesh.position.y += m.vy * h;
      m.mesh.position.z += m.vz * h;
      m.rx += m.wx * h; // capriole solo mentre vola
      m.rz += m.wz * h;
    }

    // 2) supporto: quanto in alto può stare ogni lira (dal basso verso l'alto)
    const ordinate = lire.filter(m => m.attiva).sort((a, b) => a.mesh.position.y - b.mesh.position.y);
    const raggioSupporto = COIN_R * 1.6, rq = raggioSupporto * raggioSupporto;
    for (let i = 0; i < ordinate.length; i++) {
      const m = ordinate[i];
      const p = m.mesh.position;
      let restY = 0.06; // superficie del tavolo
      let appoggio = null;
      // sopra la piastra le lire viaggiano con lei
      if (Math.abs(p.x) < 3.95 && p.z > pusherZ - halfD && p.z < pusherZ + halfD) restY = 0.18;
      for (let j = 0; j < i; j++) {
        const o = ordinate[j];
        const oz = o.mesh.position.z;
        if (p.z - oz >= raggioSupporto || oz - p.z >= raggioSupporto) continue; // scarto rapido
        const dx = p.x - o.mesh.position.x, dz = p.z - oz;
        if (dx * dx + dz * dz < rq) {
          // una torre non cresce all'infinito: oltre 4 lire la pila cede
          if (Math.round((o.mesh.position.y - 0.06) / COIN_H) + 1 >= 4) continue;
          const top = o.mesh.position.y + COIN_H;
          if (top > restY) { restY = top; appoggio = o; }
        }
      }
      // oltre il bordo anteriore: niente più supporto, la lira cade giù
      if (p.z < -5) restY = -100;
      m.sotto = appoggio;

      if (p.y <= restY) {
        p.y = restY;
        if (m.vy < 0) m.vy = 0; // NESSUN rimbalzo: si ferma e basta
        m.aTerra = true;
        if (!m.atterrata) { m.atterrata = true; suAtterraggio(m); } // suono ed effetti all'atterraggio
        // --- TORRI: premiata una volta sola per lira (se l'abilità è ON) ---
        const livello = appoggio ? Math.round((p.y - 0.06) / COIN_H) + 1 : 1;
        if (livello >= 3 && !m.torrePremiato && stato.attivi.torri) { m.torrePremiato = true; suTorre(p, livello); }
      } else {
        m.aTerra = false;
      }
    }

    // 3) comportamento a contatto + piastra + sponde
    for (const m of lire) {
      if (!m.attiva) continue;
      const p = m.mesh.position;

      if (m.aTerra) {
        // la lira si assesta SDRAIATA (piatta)
        const att = Math.exp(-9 * h);
        m.rx *= att; m.rz *= att;
        m.wx = 0; m.wz = 0;
        // attrito forte: la pila non scivola da sola
        const fr = Math.exp(-GROUND_FRICTION * h);
        m.vx *= fr; m.vz *= fr;
        if (Math.hypot(m.vx, m.vz) < 0.02) { m.vx = 0; m.vz = 0; }
        // TORRI: la lira si centra su quella che ha sotto (pile ordinate e soddisfacenti)
        if (m.sotto && m.sotto.attiva) {
          const k = Math.min(1, 6 * h);
          p.x += (m.sotto.mesh.position.x - p.x) * k;
          p.z += (m.sotto.mesh.position.z - p.z) * k;
        }
      } else {
        const fr = Math.exp(-AIR_DRAG * h);
        m.vx *= fr; m.vz *= fr;
      }

      // Piastra: TRASPORTA le lire che poggiano sopra, SPINGE la pila davanti a sé
      const sopraPiastra = p.y > 0.10 && p.y < 0.60 &&
        Math.abs(p.x) < 3.95 && p.z > pusherZ - halfD && p.z < pusherZ + halfD;
      if (sopraPiastra) {
        p.z += pusherVel * h;
        m.vz = pusherVel;
      } else if (pusherVel < 0 && p.y < 0.12 &&
                 p.z > face - COIN_R && p.z < pusherZ + halfD) {
        // la faccia spinge la pila lentamente in avanti
        p.z = face - COIN_R;
        m.vz = Math.min(m.vz, pusherVel);
      }

      // Sponde
      if (p.x < -3.9) { p.x = -3.9; m.vx = Math.abs(m.vx) * 0.4; }
      if (p.x >  3.9) { p.x =  3.9; m.vx = -Math.abs(m.vx) * 0.4; }
      if (p.z >  4.9) { p.z =  4.9; m.vz = -Math.abs(m.vz) * 0.4; }
    }

    // 4) collisione lira-lira (solo a pari altezza: chi sta sopra non viene spinto di lato)
    const minD = COIN_R * 2 * 0.98;
    for (let i = 0; i < lire.length; i++) {
      const a = lire[i];
      if (!a.attiva) continue;
      const az = a.mesh.position.z, ay = a.mesh.position.y, ax = a.mesh.position.x;
      for (let j = i + 1; j < lire.length; j++) {
        const b = lire[j];
        if (!b.attiva) continue;
        const bz = b.mesh.position.z;
        if (az - bz >= minD || bz - az >= minD) continue; // scarto rapido (la maggior parte delle coppie)
        if (Math.abs(ay - b.mesh.position.y) > 0.08) continue;
        const dx = ax - b.mesh.position.x;
        const dz = az - bz;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < minD && dist > 0.0001) {
          const nx = dx / dist, nz = dz / dist;
          const overlap = (minD - dist) / 2;
          a.mesh.position.x += nx * overlap; a.mesh.position.z += nz * overlap;
          b.mesh.position.x -= nx * overlap; b.mesh.position.z -= nz * overlap;
          const rvn = (a.vx - b.vx) * nx + (a.vz - b.vz) * nz;
          if (rvn < 0) {
            const imp = rvn * 0.55;
            a.vx -= nx * imp; a.vz -= nz * imp;
            b.vx += nx * imp; b.vz += nz * imp;
          }
        }
      }
    }

    // 5) caduta dal bordo = lira vinta
    for (let i = lire.length - 1; i >= 0; i--) {
      const m = lire[i];
      if (!m.attiva) continue;
      if (m.mesh.position.z < -5 && m.mesh.position.y < -1.2) {
        m.attiva = false;
        scene.remove(m.mesh);
        vinciLira(m.mesh.position);
      }
    }
  }

  // applica rotazioni, inclinazioni e animazioni alle mesh
  for (const m of lire) {
    if (!m.attiva) continue;
    m.mesh.rotation.x = m.rx;
    m.mesh.rotation.z = m.rz;
    if (m.pulse > 0) {
      m.pulse = Math.max(0, m.pulse - dt * 2.4);
      m.mesh.scale.setScalar(1 + m.pulse * 0.2);
    } else if (m.mesh.scale.x !== 1) {
      m.mesh.scale.setScalar(1);
    }
  }
}

// ============ VINCITE, COMBO, TORRI, ATTERRAGGI ============
let combo = 0, comboScadenza = 0;
const elCombo = document.getElementById('combo');

function mostraCombo(n) {
  elCombo.textContent = 'COMBO x' + n;
  elCombo.classList.remove('mostra');
  void elCombo.offsetWidth;
  elCombo.classList.add('mostra');
}

// una lira è caduta dal bordo: paga, suona, festeggia
function vinciLira(pos) {
  const ora = performance.now();
  combo = (ora - comboScadenza < 2600) ? combo + 1 : 1;
  comboScadenza = ora + 2600;
  stato.comboMax = Math.max(stato.comboMax, combo);
  const guadagno = 1 + Math.floor(combo / 5); // bonus combo ogni 5 di fila
  stato.saldo += guadagno;
  stato.vinte += 1;
  stato.totVinte += 1;
  if (combo >= 3) mostraCombo(combo);
  testoVolante(pos.x, 0.3, -4.6, '+' + guadagno + (guadagno > 1 ? ' BONUS' : ''), guadagno > 1 ? 'bonus' : '');
  particelle(pos.x, 0.2, -4.9, 6 + Math.min(12, combo), 0xffd54a, 0.9);
  suono.vinci(combo);
  if (combo >= 5) {
    const lampo = document.createElement('div');
    lampo.className = 'lampo';
    document.body.appendChild(lampo);
    setTimeout(() => lampo.remove(), 520);
    scossa(0.3);
  }
  aggiornaHUD();
}

// torre di lire completata
function suTorre(p, livello) {
  const bonus = 1 + (livello - 3);
  stato.saldo += bonus;
  stato.totTorri += 1;
  testoVolante(p.x, p.y + 0.35, p.z, 'TORRE x' + livello + '  +' + bonus, 'torre');
  particelle(p.x, p.y, p.z, 12 + livello * 2, 0x7ef0c0, 1);
  suono.torre();
  aggiornaHUD();
  // tutte le lire della torre pulsano
  for (const q of lire) {
    if (!q.attiva) continue;
    if (Math.abs(q.mesh.position.x - p.x) < 0.25 && Math.abs(q.mesh.position.z - p.z) < 0.25) q.pulse = 1;
  }
}

// atterraggio: suono, scintille e (se la lira ha spinta) colpo che spazza la pila
function suAtterraggio(m) {
  const p = m.mesh.position;
  suono.atterra(m.vy);
  particelle(p.x, Math.max(0.08, p.y - 0.06), p.z, 4, 0xffe9a8, 0.5);
  if (m.spinta > 0) {
    const spinta = m.spinta;
    for (const q of lire) {
      if (!q.attiva || q === m) continue;
      const dx = q.mesh.position.x - p.x, dz = q.mesh.position.z - p.z;
      const d2 = dx * dx + dz * dz;
      if (d2 > 4.6) continue;
      const d = Math.max(0.25, Math.sqrt(d2));
      const k = (1 - d / 2.15) * 3.2 * spinta;
      q.vz -= k;                          // spinta verso il bordo di caduta
      q.vx += (dx / d) * k * 0.5;
      q.vy = Math.max(q.vy, Math.min(0.9, 0.22 * spinta)); // piccolo sobbalzo, mai salti alti
      q.pulse = 0.8;
    }
    particelle(p.x, 0.45, p.z, m.proiettile ? 22 : 10, 0xffb03a, 1.4);
    scossa(m.proiettile ? 0.7 + 0.4 * spinta : 0.2 * spinta);
  }
}

// ============ EFFETTI (particelle, testi volanti, scossa) ============
const gruppoParticelle = new THREE.Group();
scene.add(gruppoParticelle);
const poolParticelle = [];
const PARTICELLE_MAX = 240;
function creaParticella() {
  const mat = new THREE.SpriteMaterial({
    map: texScintilla, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const s = new THREE.Sprite(mat);
  s.visible = false;
  gruppoParticelle.add(s);
  const p = { sprite: s, vita: 0, vitaMax: 1, vx: 0, vy: 0, vz: 0, taglia: 0.4 };
  poolParticelle.push(p);
  return p;
}
function particelle(x, y, z, quante, colore = 0xffd54a, forza = 1) {
  for (let i = 0; i < quante; i++) {
    let p = poolParticelle.find(q => q.vita <= 0);
    if (!p) {
      if (poolParticelle.length >= PARTICELLE_MAX) return;
      p = creaParticella();
    }
    p.vita = p.vitaMax = 0.5 + Math.random() * 0.45;
    p.vx = (Math.random() - 0.5) * 2.4 * forza;
    p.vz = (Math.random() - 0.5) * 2.4 * forza;
    p.vy = 1.1 + Math.random() * 2.2 * forza;
    p.taglia = 0.2 + Math.random() * 0.3;
    p.sprite.visible = true;
    p.sprite.material.color.setHex(colore);
    p.sprite.position.set(x, y, z);
    p.sprite.scale.setScalar(p.taglia);
  }
}
function aggiornaParticelle(dt) {
  for (const p of poolParticelle) {
    if (p.vita <= 0) continue;
    p.vita -= dt;
    if (p.vita <= 0) { p.sprite.visible = false; continue; }
    p.vy -= 6 * dt;
    p.sprite.position.x += p.vx * dt;
    p.sprite.position.y += p.vy * dt;
    p.sprite.position.z += p.vz * dt;
    const k = p.vita / p.vitaMax;
    p.sprite.material.opacity = k;
    p.sprite.scale.setScalar(p.taglia * (0.5 + k * 0.9));
  }
}

// testi volanti in HTML, proiettati dal mondo 3D
const contenitoreFloater = document.getElementById('floaters');
function proietta(x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(camera);
  return { sx: (v.x * 0.5 + 0.5) * innerWidth, sy: (-v.y * 0.5 + 0.5) * innerHeight };
}
function testoVolante(x, y, z, testo, classe = '') {
  const { sx, sy } = proietta(x, y, z);
  if (!isFinite(sx) || !isFinite(sy)) return;
  if (sx < -100 || sx > innerWidth + 100 || sy < -100 || sy > innerHeight + 100) return;
  const d = document.createElement('div');
  d.className = 'floater ' + classe;
  d.textContent = testo;
  d.style.left = sx + 'px';
  d.style.top = sy + 'px';
  contenitoreFloater.appendChild(d);
  setTimeout(() => d.remove(), 1100);
}
function avviso(testo) {
  testoVolante(0, 0.5, 1, testo, 'bonus');
}
let scossaForza = 0;
function scossa(f) { scossaForza = Math.max(scossaForza, f); }

// ============ HUD ============
const elSaldo = document.getElementById('saldo');
const elVinte = document.getElementById('vinte');
const elIdleRate = document.getElementById('idleRate');
const elIdleBar = document.getElementById('idleBar');
const elCarica = document.getElementById('carica');
const elCaricaBar = document.getElementById('caricaBar');
const elCaricaTxt = document.getElementById('caricaTxt');
const fmt = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',');
function aggiornaHUD() {
  elSaldo.textContent = Math.floor(stato.saldo);
  elVinte.textContent = stato.vinte;
  elIdleRate.textContent = (stato.attivi.idle ? fmt(rateIdle(stato.pot.idle)) : '0,0') + '/s';
}

// ============ ABILITÀ: interruttori ON/OFF ============
const chipAbilita = [
  { id: 'cannone', sbloccata: () => stato.sbloccati.cannone, nota: () => 'carica' },
  { id: 'raffica', sbloccata: () => stato.pot.raffica > 0, nota: () => rateRaffica(stato.pot.raffica).toFixed(0) + '/s' },
  { id: 'forza', sbloccata: () => stato.pot.forza > 0, nota: () => 'x' + fmt(fattoreForza(stato.pot.forza)) },
  { id: 'multi', sbloccata: () => stato.pot.multi > 0, nota: () => lirePerLancio(stato.pot.multi) + 'x' },
  { id: 'idle', sbloccata: () => stato.pot.idle > 0, nota: () => fmt(rateIdle(stato.pot.idle)) + '/s' },
  { id: 'torri', sbloccata: () => true, nota: () => 'bonus' },
  { id: 'audio', sbloccata: () => true, nota: () => (stato.audio ? 'ON' : 'OFF') }
];
function aggiornaAbilita() {
  for (const c of chipAbilita) {
    const el = document.getElementById('ch-' + c.id);
    if (!el) continue;
    const sbloccata = c.sbloccata();
    const acceso = c.id === 'audio' ? stato.audio : (sbloccata && !!stato.attivi[c.id]);
    el.classList.toggle('bloccata', !sbloccata);
    el.classList.toggle('on', acceso);
    el.classList.toggle('off', !acceso);
    if ('disabled' in el) el.disabled = !sbloccata;
    const piccolo = el.querySelector ? el.querySelector('small') : null;
    if (piccolo) piccolo.textContent = sbloccata ? c.nota() : 'bloccata';
  }
  if (typeof aggiornaSpara === 'function') aggiornaSpara();
}
function cambiaAbilita(id) {
  if (id === 'audio') {
    stato.audio = !stato.audio;
  } else {
    const c = chipAbilita.find(q => q.id === id);
    if (!c || !c.sbloccata()) { suono.errore(); avviso('Prima sbloccalo nel negozio'); return; }
    stato.attivi[id] = !stato.attivi[id];
  }
  if (id === 'raffica') { inRaffica = false; accRaffica = 0; }
  suono.compra();
  aggiornaAbilita();
  aggiornaHUD();
  rendiNegozio();
  salvaPartita();
}
function collegaAbilita() {
  for (const c of chipAbilita) {
    const el = document.getElementById('ch-' + c.id);
    if (el) el.onclick = () => cambiaAbilita(c.id);
  }
  aggiornaAbilita();
}

// ============ NEGOZIO ============
const elNegozio = document.getElementById('negozio');
const elVoci = document.getElementById('voci');
let schedaAttiva = 'pot';

function riga(o) {
  const massimo = !!o.max2;
  const dis = (massimo || o.bloccato || stato.saldo < o.costo) ? 'disabled' : '';
  const testo = massimo ? (o.etichettaMax || 'MAX') : (o.bloccato ? 'BLOCCATO' : 'ACQUISTA · ' + o.costo);
  return '<div class="voce' + (massimo ? ' max' : '') + '">' +
    '<div><div class="nome">' + o.nome + (o.extra ? '<em>' + o.extra + '</em>' : '') + '</div>' +
    '<div class="desc">' + o.desc + '</div>' +
    (o.lv !== undefined ? '<div class="lv">LIVELLO ' + o.lv + (o.max !== undefined ? ' / ' + o.max : '') + '</div>' : '') +
    '</div><button class="compra" data-id="' + o.id + '" ' + dis + '>' + testo + '</button></div>';
}

function rendiNegozio() {
  const p = stato.pot;
  let html = '';
  if (schedaAttiva === 'pot') {
    html += riga({ id: 'idle', nome: 'PRODUZIONE IDLE', extra: fmt(rateIdle(p.idle)) + ' lire/s',
      desc: 'Lire generate da sole col passare del tempo: entrano nel saldo e le lanci quando vuoi. Ogni livello aumenta la produzione.',
      lv: p.idle, max: LIVELLI_MAX.idle, costo: costoIdle(p.idle), max2: p.idle >= LIVELLI_MAX.idle });
    html += riga({ id: 'forza', nome: 'FORZA DI LANCIO', extra: 'x' + fmt(fattoreForza(p.forza)),
      desc: 'Le lire lanciate colpiscono più forte: all\'impatto spingono la pila verso il bordo di caduta.',
      lv: p.forza, max: LIVELLI_MAX.forza, costo: costoForza(p.forza), max2: p.forza >= LIVELLI_MAX.forza });
    html += riga({ id: 'multi', nome: 'MULTI-LANCIO', extra: lirePerLancio(p.multi) + ' lire per click',
      desc: 'Lancia più lire con un solo click (ognuna costa 1 lira dal saldo).',
      lv: p.multi, max: LIVELLI_MAX.multi, costo: costoMulti(p.multi), max2: p.multi >= LIVELLI_MAX.multi });
    html += riga({ id: 'raffica', nome: 'RAFFICA',
      extra: p.raffica > 0 ? rateRaffica(p.raffica).toFixed(0) + ' lire/s' : 'da sbloccare',
      desc: 'Tieni premuto il tasto sinistro e le lire partono una dietro l\'altra verso la pila, senza fermarti.',
      lv: p.raffica, max: LIVELLI_MAX.raffica, costo: costoRaffica(p.raffica), max2: p.raffica >= LIVELLI_MAX.raffica });
    html += riga({ id: 'cannonePot', nome: 'POTENZA CANNONE',
      extra: stato.sbloccati.cannone ? 'x' + fmt(forzaCannone(p.cannonePot)) : 'da sbloccare',
      desc: 'Rende più violento lo sparo: tieni premuto il tasto sinistro per caricare, rilascia per sparare.',
      lv: p.cannonePot, max: LIVELLI_MAX.cannonePot, costo: costoCannonePot(p.cannonePot),
      max2: p.cannonePot >= LIVELLI_MAX.cannonePot, bloccato: !stato.sbloccati.cannone });
  } else if (schedaAttiva === 'sblocca') {
    html += riga({ id: 'cannone', nome: 'CANNONE', extra: stato.sbloccati.cannone ? 'SBLOCCATO' : 'ABILITÀ NUOVA',
      desc: 'Tieni premuto il tasto destro per caricare lo sparo che travolge la pila.',
      costo: COSTO_CANNONE, max2: stato.sbloccati.cannone });
    for (const s of ['argento', 'rubino', 'arcobaleno']) {
      const pos = stato.skinPossedute.includes(s);
      const inUso = pos && stato.sbloccati.skin === s;
      html += riga({ id: 'skin_' + s, nome: 'LIRE ' + SKIN_LIRE[s].nome.toUpperCase(),
        extra: inUso ? 'IN USO' : (pos ? 'POSSEDUTE' : ''),
        desc: pos ? 'Skin sbloccata: clicca per applicarla a tutte le lire.' : 'Cambia l\'aspetto e la lucentezza di tutte le lire.',
        costo: PRESTIGIO[s], max2: inUso });
    }
    for (const f of ['blu', 'bordeaux', 'notte']) {
      const pos = stato.feltriPosseduti.includes(f);
      const inUso = pos && stato.sbloccati.feltro === f;
      html += riga({ id: 'feltro_' + f, nome: 'FELTRO ' + NOME_FELTRO[f].toUpperCase(),
        extra: inUso ? 'IN USO' : (pos ? 'POSSEDUTO' : ''),
        desc: 'Nuovo colore del panno del tavolo della sala.',
        costo: COSTO_FELTRO[f], max2: inUso });
    }
  } else if (schedaAttiva === 'abilita') {
    const vociAb = [
      { id: 'cannone', nome: 'CANNONE', desc: 'Tieni premuto il tasto destro per caricare lo sparo che travolge la pila.', sbloccata: stato.sbloccati.cannone },
      { id: 'raffica', nome: 'RAFFICA', desc: 'Tieni premuto e spari una lira dietro l\'altra (' + rateRaffica(p.raffica).toFixed(0) + '/s).', sbloccata: p.raffica > 0 },
      { id: 'forza', nome: 'FORZA DI LANCIO', desc: 'Ogni lira lanciata colpisce la pila spingendola verso il bordo.', sbloccata: p.forza > 0 },
      { id: 'multi', nome: 'MULTI-LANCIO', desc: 'Lancia più lire per click (ora ' + lirePerLancio(p.multi) + ').', sbloccata: p.multi > 0 },
      { id: 'idle', nome: 'PRODUZIONE IDLE', desc: 'Lire generate da sole nel saldo (' + fmt(rateIdle(p.idle)) + '/s).', sbloccata: p.idle > 0 },
      { id: 'torri', nome: 'BONUS TORRI', desc: 'Premio quando si formano torri di 3 o più lire.', sbloccata: true },
      { id: 'audio', nome: 'AUDIO', desc: 'Effetti sonori della sala, sintetizzati in tempo reale (nessun file esterno).', sbloccata: true }
    ];
    html = vociAb.map(v => {
      const acceso = v.id === 'audio' ? stato.audio : (v.sbloccata && !!stato.attivi[v.id]);
      return '<div class="voce"><div><div class="nome">' + v.nome + '</div>' +
        '<div class="desc">' + v.desc + '</div>' +
        '<div class="lv">' + (v.sbloccata ? (acceso ? 'ATTIVA' : 'DISATTIVATA') : 'DA SBLOCCARE NEL NEGOZIO') + '</div></div>' +
        '<button class="inter' + (acceso ? ' acceso' : '') + '" data-ab="' + v.id + '"' + (v.sbloccata ? '' : ' disabled') + '>' +
        '<span class="pallino"></span>' + (acceso ? 'ON' : 'OFF') + '</button></div>';
    }).join('');
  } else {
    html = '<div class="voce"><div class="riepilogo">' +
      'Lire vinte in totale: <b>' + stato.totVinte + '</b><br>' +
      'Lire lanciate: <b>' + stato.totLanci + '</b><br>' +
      'Torri costruite: <b>' + stato.totTorri + '</b><br>' +
      'Combo massima: <b>x' + stato.comboMax + '</b><br>' +
      'Produzione idle: <b>' + fmt(rateIdle(p.idle)) + ' lire/s</b><br>' +
      'Saldo attuale: <b>' + Math.floor(stato.saldo) + '</b>' +
      '</div><button class="compra" data-id="azzera">AZZERA TUTTO</button></div>';
  }
  elVoci.innerHTML = html;
  elVoci.querySelectorAll('button.compra').forEach(b => { b.onclick = () => compra(b.dataset.id); });
  elVoci.querySelectorAll('button.inter').forEach(b => { b.onclick = () => cambiaAbilita(b.dataset.ab); });
}

function compra(id) {
  const p = stato.pot;
  const paga = (c) => {
    if (stato.saldo < c) { suono.errore(); return false; }
    stato.saldo -= c;
    return true;
  };
  if (id === 'idle' && p.idle < LIVELLI_MAX.idle) { if (paga(costoIdle(p.idle))) { p.idle++; suono.compra(); } }
  else if (id === 'forza' && p.forza < LIVELLI_MAX.forza) { if (paga(costoForza(p.forza))) { p.forza++; suono.compra(); } }
  else if (id === 'multi' && p.multi < LIVELLI_MAX.multi) { if (paga(costoMulti(p.multi))) { p.multi++; suono.compra(); } }
  else if (id === 'raffica' && p.raffica < LIVELLI_MAX.raffica) {
    if (paga(costoRaffica(p.raffica))) {
      p.raffica++;
      stato.attivi.raffica = true;
      if (p.raffica === 1) { suono.sblocco(); avviso('RAFFICA SBLOCCATA!'); }
      else suono.compra();
    }
  }
  else if (id === 'cannonePot' && stato.sbloccati.cannone && p.cannonePot < LIVELLI_MAX.cannonePot) {
    if (paga(costoCannonePot(p.cannonePot))) { p.cannonePot++; suono.compra(); }
  }
  else if (id === 'cannone' && !stato.sbloccati.cannone) {
    if (paga(COSTO_CANNONE)) {
      stato.sbloccati.cannone = true;
      suono.sblocco();
      particelle(0, 0.6, 0, 34, 0xffd54a, 2);
      avviso('CANNONE SBLOCCATO!');
    }
  }
  else if (id.indexOf('skin_') === 0) {
    const s = id.slice(5);
    if (stato.skinPossedute.includes(s)) { applicaSkin(s); suono.compra(); }
    else if (paga(PRESTIGIO[s])) { stato.skinPossedute.push(s); applicaSkin(s); suono.sblocco(); }
  }
  else if (id.indexOf('feltro_') === 0) {
    const f = id.slice(7);
    const applica = () => { stato.sbloccati.feltro = f; tavoloMat.color.setHex(COLORE_FELTRI[f]); };
    if (stato.feltriPosseduti.includes(f)) { applica(); suono.compra(); }
    else if (paga(COSTO_FELTRO[f])) { stato.feltriPosseduti.push(f); applica(); suono.sblocco(); }
  }
  else if (id === 'azzera') {
    if (confirm('Azzerare saldo, potenziamenti e sbloccabili?')) {
      localStorage.removeItem(CHIAVE_SALVATAGGIO);
      location.reload();
    }
    return;
  }
  aggiornaHUD();
  aggiornaAbilita();
  salvaPartita();
  rendiNegozio();
}

// ============ LOOP ============
let lastTime = performance.now();
let tempoSalvataggio = 0;
let t = 0;
let sparaPronto = true;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  t += dt;

  aggiornaFisica(dt);
  aggiornaParticelle(dt);

  // --- produzione idle: lire che entrano da sole nel saldo (se l'abilità è ON) ---
  const rate = stato.attivi.idle ? rateIdle(stato.pot.idle) : 0;
  if (rate > 0) {
    stato.idleAcc += rate * dt;
    if (stato.idleAcc >= 1) {
      const g = Math.floor(stato.idleAcc);
      stato.idleAcc -= g;
      stato.saldo += g;
      aggiornaHUD();
    }
  }
  elIdleBar.style.width = (stato.idleAcc * 100).toFixed(0) + '%';

  // --- RAFFICA: tieni premuto e le lire partono una dietro l'altra ---
  if (inRaffica) {
    const rr = stato.attivi.raffica ? rateRaffica(stato.pot.raffica) : 0;
    if (rr <= 0 || stato.saldo <= 0 || !puntatore.dentro) {
      inRaffica = false;
      accRaffica = 0;
    } else {
      accRaffica += dt;
      const intervallo = 1 / rr;
      let giri = 0;
      while (accRaffica >= intervallo && giri < 4) { // max 4 lanci per frame
        accRaffica -= intervallo;
        lanciaDalPuntatore(true);
        colpiRaffica++;
        giri++;
      }
    }
  } else accRaffica = 0;

  // --- cannone: carica, ricarica, colore del mirino ---
  if (inCarica) {
    carica = Math.min(1, carica + dt / SPARO_MAX);
    elCaricaBar.style.width = (carica * 100).toFixed(0) + '%';
    elCaricaTxt.textContent = 'CANNONE ' + Math.round(carica * 100) + '%';
    mirinoMat.color.setHex(0xff9a3c);
    mirino.scale.setScalar(1 + carica * 0.6);
  } else {
    if (cooldownSparo > 0) cooldownSparo = Math.max(0, cooldownSparo - dt);
    mirino.scale.setScalar(1);
    mirinoMat.color.setHex(stato.sbloccati.cannone && cooldownSparo <= 0 ? 0x7ef0c0 : 0xffd54a);
  }
  if (TATTILE) { // il pulsante SPARA si aggiorna solo quando cambia stato
    const pronto = cooldownSparo <= 0 && stato.saldo > 0;
    if (pronto !== sparaPronto) { sparaPronto = pronto; aggiornaSpara(); }
  }

  // --- mirino e lira fantasma seguono il puntatore ---
  if (puntatore.visibile) {
    mirino.visible = true;
    mirino.position.x = puntatore.x;
    mirino.position.z = puntatore.z;
    mirinoMat.opacity = puntatore.dentro ? 0.95 : 0.3;
    liraFantasma.visible = puntatore.dentro;
    liraFantasma.position.set(puntatore.x, 1.5 + Math.sin(t * 2.6) * 0.2, puntatore.z);
    liraFantasma.rotation.y = t * 0.9;
  } else {
    mirino.visible = false;
    liraFantasma.visible = false;
  }

  // --- zona di lancio pulsante ---
  zonaMat.opacity = 0.34 + (Math.sin(t * 1.9) * 0.5 + 0.5) * 0.28;
  zonaMesh.scale.setScalar(1 + Math.sin(t * 1.9) * 0.005);

  // --- skin arcobaleno: la tinta gira nel tempo ---
  const matArc = cacheMateriali.arcobaleno;
  if (matArc && stato.sbloccati.skin === 'arcobaleno') {
    const hue = (t * 0.1) % 1;
    matArc[1].emissive.setHSL(hue, 0.9, 0.3);
    matArc[1].color.setHSL(hue, 0.5, 0.9);
    matArc[0].color.setHSL(hue, 0.8, 0.6);
  }

  if (combo > 0 && now > comboScadenza) combo = 0;

  // --- camera: zoom + scossa ---
  const targetPos = new THREE.Vector3(0, 10 * cameraZoom, -12 * cameraZoom);
  camera.position.lerp(targetPos, 0.1);
  if (scossaForza > 0) {
    scossaForza = Math.max(0, scossaForza - dt * 2.6);
    camera.position.x += (Math.random() - 0.5) * scossaForza * 0.5;
    camera.position.y += (Math.random() - 0.5) * scossaForza * 0.4;
  }
  camera.lookAt(0, 0, 0);

  tempoSalvataggio += dt;
  if (tempoSalvataggio > 4) { tempoSalvataggio = 0; salvaPartita(); }

  renderer.render(scene, camera);
}

// ============ INTERFACCIA (negozio, audio, scorciatoie) ============
// sparo dal pulsante dedicato (telefono): parte già carico al massimo
const elSpara = document.getElementById('spara');
elSpara.onclick = () => {
  if (!stato.sbloccati.cannone || cooldownSparo > 0) { suono.errore(); return; }
  if (!puntatore.visibile || !puntatore.dentro) { suono.errore(); avviso('Tocca il tavolo per mirare'); return; }
  sparaCannone(puntatore.x, puntatore.z, 1);
};
function aggiornaSpara() {
  if (!elSpara) return;
  const mostralo = TATTILE && stato.sbloccati.cannone;
  elSpara.style.display = mostralo ? 'inline-flex' : 'none';
  if (mostralo) {
    elSpara.disabled = cooldownSparo > 0 || stato.saldo <= 0;
    elSpara.style.opacity = elSpara.disabled ? '.45' : '1';
  }
}
document.getElementById('apriNegozio').onclick = () => {
  elNegozio.classList.remove('chiuso');
  rendiNegozio();
  suono.compra();
};
document.getElementById('chiudiNegozio').onclick = () => elNegozio.classList.add('chiuso');
elNegozio.addEventListener('click', (e) => { if (e.target === elNegozio) elNegozio.classList.add('chiuso'); });
document.querySelectorAll('.tab button').forEach(b => {
  b.onclick = () => {
    schedaAttiva = b.dataset.tab;
    document.querySelectorAll('.tab button').forEach(q => q.classList.toggle('sel', q === b));
    rendiNegozio();
  };
});
collegaAbilita();
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') elNegozio.classList.add('chiuso');
  if (e.key === 'b' || e.key === 'B') {
    elNegozio.classList.toggle('chiuso');
    if (!elNegozio.classList.contains('chiuso')) rendiNegozio();
    return;
  }
  // scorciatoie abilità: C cannone · R raffica · F forza · M multi · I idle · T torri · A audio
  const tasti = { c: 'cannone', r: 'raffica', f: 'forza', m: 'multi', i: 'idle', t: 'torri', a: 'audio' };
  const ab = tasti[e.key.toLowerCase()];
  if (ab) cambiaAbilita(ab);
});
addEventListener('beforeunload', salvaPartita);

// ============ AVVIO ============
tavoloMat.color.setHex(COLORE_FELTRI[stato.sbloccati.feltro] || COLORE_FELTRI.verde);
aggiornaHUD();
aggiornaAbilita();
aggiornaSpara();
rendiNegozio();
animate();
</script>
