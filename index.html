    html += titolo('⚙️ OPZIONI · GRAFICA E AUDIO');
    html += rigaOpzione({ id: 'audio', icona: '🔊', nome: 'AUDIO', valore: stato.audio ? 1 : 0,
      desc: 'Effetti sonori della sala, sintetizzati in tempo reale (nessun file esterno).',
      scelte: [{ val: 1, testo: 'ACCESO' }, { val: 0, testo: 'SPENTO' }] });
    html += rigaOpzione({ id: 'ombre', icona: '🌑', nome: 'OMBRE', valore: stato.grafica.ombre ? 1 : 0,
      desc: 'Le ombre delle lire sono belle ma pesanti: spegnendole si guadagnano parecchi fotogrammi, soprattutto su telefono.',
      scelte: [{ val: 1, testo: 'ACCESE' }, { val: 0, testo: 'SPENTE' }] });
    html += rigaOpzione({ id: 'effetti', icona: '✨', nome: 'EFFETTI', valore: stato.grafica.effetti,
      desc: 'Quante scintille, lampi e testi volanti mostrare quando vinci.',
      scelte: [{ val: 1, testo: 'PIENI' }, { val: 0.5, testo: 'RIDOTTI' }, { val: 0, testo: 'NESSUNO' }] });
    html += rigaOpzione({ id: 'auto', icona: '🎛️', nome: 'QUALITÀ AUTOMATICA', valore: stato.grafica.auto ? 1 : 0,
      desc: 'Se il gioco rallenta abbassa da sola la risoluzione di disegno, e la rialza appena torna fluido.',
      scelte: [{ val: 1, testo: 'ATTIVA' }, { val: 0, testo: 'FISSA' }] });
    html += rigaOpzione({ id: 'fps', icona: '🏞️', nome: 'CONTAFOTOGRAMMI', valore: stato.grafica.fps ? 1 : 0,
      desc: 'Mostra gli FPS nell\'HUD, utile per capire se una scelta grafica aiuta davvero.',
      scelte: [{ val: 1, testo: 'MOSTRA' }, { val: 0, testo: 'NASCONDI' }] });
    html += titolo('♻️ TAVOLO');
    html += '<div class="voce"><div class="riepilogo">' +
      'Le <b>lire non finiscono mai</b> e il tavolo <b>non si riempie mai</b>: quando ci sono ' +
      'troppe lire in scena (oltre <b>' + MAX_LIRE + '</b>) il tavolo ritira da solo quelle in fondo, ' +
      'lontano dal bordo dei premi.<br>Lire ritirate finora: <b>' + stato.totRiciclate + '</b>' +
      '</div></div>';
    html += '<div class="voce"><div><div class="nome"><span class="ico">⚠️</span>RICOMINCIA DA ZERO</div>' +
      '<div class="desc">Cancella saldo, potenziamenti, sbloccabili e record. Non si torna indietro.</div></div>' +
      '<button class="compra" data-id="azzera"><b>AZZERA TUTTO</b><i>salvataggio cancellato</i></button></div>';
  } else {
    html += titolo('📊 LA TUA PARTITA');
    html += '<div class="voce"><div class="riepilogo">' +
      'Lire vinte in totale: <b>' + stato.totVinte + '</b><br>' +
      'Lire lanciate: <b>' + stato.totLanci + '</b><br>' +
      'Lire in scena adesso: <b>' + lireSulTavolo() + '</b> / ' + MAX_LIRE + '<br>' +
      'Lire ritirate dal tavolo ♻️: <b>' + stato.totRiciclate + '</b><br>' +
      'Torri costruite: <b>' + stato.totTorri + '</b> · record <b>x' + (stato.torreRecord || 1) + '/30</b><br>' +
      'Combo massima: <b>x' + stato.comboMax + '</b> (bonus max +' + COMBO_BONUS_MAX + ')<br>' +
      'Modalità in uso: <b>' + modoAttuale() + '</b><br>' +
      'Taglio in uso: <b>' + nomeTaglio(p.taglio) + '</b><br>' +
      'Ricarica gettoni: <b>' + fmt(ricaricaGettoni(p.idle)) + '/s</b> (cap ' + capCaricatore(p.idle) + ')<br>' +
      'Premi attuali: <b>' + Math.floor(stato.premi) + '</b>' +
      '</div></div>';
  }
  elVoci.innerHTML = html;
  const premi = (b) => {
    if (b.dataset.id) compra(b.dataset.id);
    else if (b.dataset.ab) cambiaAbilita(b.dataset.ab);
    else if (b.dataset.opz) cambiaOpzione(b.dataset.opz, parseFloat(b.dataset.val));
  };
  elVoci.querySelectorAll('button.compra, button.inter, .seg button').forEach(b => {
    b.onclick = () => premi(b);
    // su telefono i bottoni del negozio devono rispondere al tocco
    b.addEventListener('touchend', (e) => { e.preventDefault(); premi(b); }, { passive: false });
  });
}

// ---------- OPZIONI: applicano subito l'effetto e si salvano ----------
function cambiaOpzione(id, val) {
  if (id === 'audio') stato.audio = val > 0;
  else if (id === 'ombre') stato.grafica.ombre = val > 0;
  else if (id === 'effetti') stato.grafica.effetti = val;
  else if (id === 'auto') stato.grafica.auto = val > 0;
  else if (id === 'fps') stato.grafica.fps = val > 0;
  applicaGrafica();
  suono.compra();
  aggiornaAbilita();
  salvaPartita();
  rendiNegozio();
}

// le ombre si accendono/spengono a gioco avviato: vanno ricompilati i materiali
function applicaGrafica() {
  const ombre = !!stato.grafica.ombre;
  if (renderer.shadowMap.enabled !== ombre) {
    renderer.shadowMap.enabled = ombre;
    scene.traverse((o) => {
      if (!o.material) return;
      const mm = Array.isArray(o.material) ? o.material : [o.material];
      for (const q of mm) q.needsUpdate = true;
    });
  }
  spot.castShadow = ombre;
  for (const m of lire) m.mesh.castShadow = ombre;
  if (elBoxFps) elBoxFps.style.display = stato.grafica.fps ? '' : 'none';
  if (!stato.grafica.auto) { scalaRender = 1; renderer.setPixelRatio(PIXEL_RATIO_MAX); }
}

function compra(id) {
  const p = stato.pot;
  const paga = (c) => {
    if (stato.premi < c) { suono.errore(); return false; }
    stato.premi -= c;
    return true;
  };
  if (id === 'idle' && p.idle < LIVELLI_MAX.idle) { if (paga(costoIdle(p.idle))) { p.idle++; suono.compra(); } }
  else if (id === 'forza' && p.forza < LIVELLI_MAX.forza) { if (paga(costoForza(p.forza))) { p.forza++; suono.compra(); } }
  else if (id === 'multi' && p.multi < LIVELLI_MAX.multi) { if (paga(costoMulti(p.multi))) { p.multi++; suono.compra(); } }
  else if (id === 'raffica' && p.raffica < LIVELLI_MAX.raffica) {
    if (paga(costoRaffica(p.raffica))) {
      p.raffica++;
      // appena comprata si attiva, spegnendo il cannone (una sola abilità attiva)
      stato.attivi.raffica = true;
      stato.attivi.cannone = false;
      if (p.raffica === 1) { suono.sblocco(); avviso('RAFFICA SBLOCCATA! ⚡'); }
      else suono.compra();
    }
  }
  else if (id === 'cannonePot' && stato.sbloccati.cannone && p.cannonePot < LIVELLI_MAX.cannonePot) {
    if (paga(costoCannonePot(p.cannonePot))) { p.cannonePot++; suono.compra(); }
  }
  else if (id === 'cannone' && !stato.sbloccati.cannone) {
    if (paga(COSTO_CANNONE)) {
      stato.sbloccati.cannone = true;
      // appena sbloccato si attiva, spegnendo la raffica (una sola abilità attiva)
      stato.attivi.cannone = true;
      stato.attivi.raffica = false;
      suono.sblocco();
      particelle(0, 0.6, 0, 34, 0xffd54a, 2);
      avviso('CANNONE SBLOCCATO! 💥');
    }
  }
  else if (id === 'taglio' && p.taglio < TAGLI.length - 1) {
    if (paga(costoTaglio(p.taglio))) {
      p.taglio++;
      aggiornaFantasma();
      suono.sblocco();
      avviso('NUOVO TAGLIO: ' + nomeTaglio(p.taglio).toUpperCase() + ' ');
      particelle(0, 1.2, 0, 30, taglio(p.taglio).colore, 1.8);
    }
  }
  else if (id.indexOf('feltro_') === 0) {
    const f = id.slice(7);
    const applica = () => { stato.sbloccati.feltro = f; tavoloMat.color.setHex(COLORE_FELTRI[f]); };
    if (stato.feltriPosseduti.includes(f)) { applica(); suono.compra(); }
    else if (paga(COSTO_FELTRO[f])) { stato.feltriPosseduti.push(f); applica(); suono.sblocco(); }
  }
  else if (id === 'azzera') {
    if (confirm('Azzerare saldo, potenziamenti e sbloccabili?')) {
      localStorage.removeItem(CHIAVE_SALVATAGGIO);
      location.reload();
    }
    return;
  }
  aggiornaHUD();
  aggiornaAbilita();
  salvaPartita();
  rendiNegozio();
}

// ============ LOOP ============
let lastTime = performance.now();
const bersaglioCamera = new THREE.Vector3();   // riusato: niente allocazioni a ogni fotogramma
let tempoSalvataggio = 0;
let t = 0;
let sparaPronto = true;

// --- contafotogrammi e qualità automatica ---
let fpsTempo = 0, fpsConta = 0;
function adattaQualita(fps) {
  if (!stato.grafica.auto) return;
  const prima = scalaRender;
  if (fps < 45) scalaRender = Math.max(0.6, scalaRender - 0.1);
  else if (fps > 57) scalaRender = Math.min(1, scalaRender + 0.05);
  if (scalaRender !== prima) renderer.setPixelRatio(PIXEL_RATIO_MAX * scalaRender);
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  t += dt;

  aggiornaFisica(dt);
  riciclaEccesso();          // ♻️ il tavolo fa spazio da solo: il lancio non si rifiuta mai
  aggiornaParticelle(dt);

  fpsConta++; fpsTempo += dt;
  if (fpsTempo >= 0.5) {
    const fps = fpsConta / fpsTempo;
    fpsConta = 0; fpsTempo = 0;
    if (stato.grafica.fps && elFps) elFps.textContent = Math.round(fps);
    adattaQualita(fps);
  }

  // --- GETTONI INFINITI: il caricatore si ricarica SEMPRE, senza interruttori che lo fermino ---
  const capG = capCaricatore(stato.pot.idle);
  if (stato.gettoni < capG) {
    stato.gettoni = Math.min(capG, stato.gettoni + ricaricaGettoni(stato.pot.idle) * dt);
    aggiornaHUD();
  } else if (stato.gettoni > capG) {
    stato.gettoni = capG;                      // potenziamento appena comprato: riempio fino al nuovo tetto
    aggiornaHUD();
  }

  // --- RAFFICA: tieni premuto e le lire partono una dietro l'altra ---
  if (inRaffica) {
    const rr = stato.attivi.raffica ? rateRaffica(stato.pot.raffica) : 0;
    if (rr <= 0 || stato.gettoni < 1 || !puntatore.dentro) {
      inRaffica = false;
      accRaffica = 0;
    } else {
      accRaffica += dt;
      const intervallo = 1 / rr;
      let giri = 0;
      while (accRaffica >= intervallo && giri < 4) { // max 4 lanci per frame
        accRaffica -= intervallo;
        lanciaDalPuntatore(true);
        colpiRaffica++;
        giri++;
      }
    }
  } else accRaffica = 0;

  // --- cannone: carica, ricarica, colore del mirino ---
  if (inCarica) {
    carica = Math.min(1, carica + dt / SPARO_MAX);
    elCaricaBar.style.width = (carica * 100).toFixed(0) + '%';
    elCaricaTxt.textContent = 'CANNONE ' + Math.round(carica * 100) + '%';
    mirinoMat.color.setHex(0xff9a3c);
    mirino.scale.setScalar(1 + carica * 0.6);
  } else {
    if (cooldownSparo > 0) cooldownSparo = Math.max(0, cooldownSparo - dt);
    mirino.scale.setScalar(1);
    mirinoMat.color.setHex(stato.sbloccati.cannone && cooldownSparo <= 0 ? 0x7ef0c0 : 0xffd54a);
  }
  if (TATTILE) { // il pulsante SPARA si aggiorna solo quando cambia stato
    const pronto = cooldownSparo <= 0 && stato.gettoni >= 1;
    if (pronto !== sparaPronto) { sparaPronto = pronto; aggiornaSpara(); }
  }

  // --- mirino, guida e lira fantasma: seguono solo la COLONNA scelta ---
  if (puntatore.visibile) {
    mirino.visible = true;
    mirino.position.x = puntatore.x;
    mirinoMat.opacity = puntatore.dentro ? 0.95 : 0.3;
    guida.visible = puntatore.dentro;
    guida.position.x = puntatore.x;
    guida.lookAt(camera.position.x, guida.position.y, camera.position.z);
    guidaMat.opacity = 0.18 + (Math.sin(t * 3.2) * 0.5 + 0.5) * 0.18;
    liraFantasma.visible = puntatore.dentro;
    liraFantasma.position.set(puntatore.x, ALTEZZA_PIASTRA + 1.3 + Math.sin(t * 2.6) * 0.18, Z_LANCIO);
    liraFantasma.rotation.y = t * 0.9;
  } else {
    mirino.visible = false;
    guida.visible = false;
    liraFantasma.visible = false;
  }

  // --- fessura di lancio pulsante ---
  zonaMat.opacity = 0.38 + (Math.sin(t * 1.9) * 0.5 + 0.5) * 0.3;

  // --- i bordi delle lire brillano di riflesso (taglio più alto = bordo più vivo) ---
  if (combo > 0 && now > comboScadenza) combo = 0;

  // --- camera: zoom (utente + arretramento in verticale) + scossa ---
  const kv = fattoreVerticale();
  bersaglioCamera.set(0, 10 * kv * cameraZoom, -12 * kv * cameraZoom);
  camera.position.lerp(bersaglioCamera, 0.1);
  if (scossaForza > 0) {
    scossaForza = Math.max(0, scossaForza - dt * 2.6);
    camera.position.x += (Math.random() - 0.5) * scossaForza * 0.5;
    camera.position.y += (Math.random() - 0.5) * scossaForza * 0.4;
  }
  camera.lookAt(0, 0, 0);

  tempoSalvataggio += dt;
  if (tempoSalvataggio > 4) { tempoSalvataggio = 0; salvaPartita(); }

  renderer.render(scene, camera);
}

// ============ INTERFACCIA (negozio, audio, scorciatoie) ============
// sparo dal pulsante dedicato (telefono): parte già carico al massimo
const elSpara = document.getElementById('spara');
elSpara.onclick = () => {
  if (!stato.sbloccati.cannone || !stato.attivi.cannone || cooldownSparo > 0) { suono.errore(); return; }
  if (!puntatore.visibile || !puntatore.dentro) { suono.errore(); avviso('Tocca il tavolo per scegliere la colonna'); return; }
  sparaCannone(puntatore.x, 1);
};
function aggiornaSpara() {
  if (!elSpara) return;
  const mostralo = TATTILE && stato.sbloccati.cannone && !!stato.attivi.cannone;
  elSpara.style.display = mostralo ? 'inline-flex' : 'none';
  if (mostralo) {
    elSpara.disabled = cooldownSparo > 0 || stato.gettoni < 1;
    elSpara.style.opacity = elSpara.disabled ? '.45' : '1';
  }
}
// ---------- apertura/chiusura negozio: funziona con mouse e con tocco ----------
function apriNegozio() {
  elNegozio.classList.remove('chiuso');
  rendiNegozio();
  suono.compra();
}
const elApriNegozio = document.getElementById('apriNegozio');
const elBoxPremi = document.getElementById('boxPremi');
let ultimaApertura = 0;
function apriNegozioSicuro(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const ora = performance.now();
  if (ora - ultimaApertura < 350) return;   // evita il doppio scatto click + touchend
  ultimaApertura = ora;
  apriNegozio();
}
for (const el of [elApriNegozio, elBoxPremi]) {
  if (!el) continue;
  el.addEventListener('click', apriNegozioSicuro);
  el.addEventListener('touchend', apriNegozioSicuro, { passive: false });
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') apriNegozioSicuro(e); });
}

document.getElementById('chiudiNegozio').onclick = () => elNegozio.classList.add('chiuso');
elNegozio.addEventListener('click', (e) => { if (e.target === elNegozio) elNegozio.classList.add('chiuso'); });
document.querySelectorAll('.tab button').forEach(b => {
  b.addEventListener('click', () => {
    schedaAttiva = b.dataset.tab;
    document.querySelectorAll('.tab button').forEach(q => q.classList.toggle('sel', q === b));
    rendiNegozio();
  });
  b.addEventListener('touchend', (e) => {
    e.preventDefault();
    schedaAttiva = b.dataset.tab;
    document.querySelectorAll('.tab button').forEach(q => q.classList.toggle('sel', q === b));
    rendiNegozio();
  }, { passive: false });
});
collegaAbilita();
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') elNegozio.classList.add('chiuso');
  if (e.key === 'b' || e.key === 'B') {
    elNegozio.classList.toggle('chiuso');
    if (!elNegozio.classList.contains('chiuso')) rendiNegozio();
    return;
  }
  // scorciatoie: C cannone · R raffica · A audio (le altre abilità sono passive, sempre attive)
  const tasti = { c: 'cannone', r: 'raffica', a: 'audio' };
  const ab = tasti[e.key.toLowerCase()];
  if (ab) cambiaAbilita(ab);
});
addEventListener('beforeunload', salvaPartita);

// ============ AVVIO ============
tavoloMat.color.setHex(COLORE_FELTRI[stato.sbloccati.feltro] || COLORE_FELTRI.verde);
// il salvataggio può arrivare da versioni vecchie: riporto i valori nei limiti validi
stato.pot.taglio = Math.max(0, Math.min(TAGLI.length - 1, parseInt(stato.pot.taglio, 10) || 0));
stato.torreRecord = Math.max(1, parseInt(stato.torreRecord, 10) || 1);
const elVersione = document.getElementById('versione');
if (elVersione) elVersione.textContent = VERSIONE;
stato.gettoni = Math.min(Math.max(stato.gettoni, 0), capCaricatore(stato.pot.idle));
stato.grafica.effetti = [0, 0.5, 1].indexOf(stato.grafica.effetti) >= 0 ? stato.grafica.effetti : 1;
stato.totRiciclate = Math.max(0, parseInt(stato.totRiciclate, 10) || 0);
aggiornaFantasma();          // l'anteprima usa il taglio scelto
applicaGrafica();            // ombre, effetti e contafotogrammi come li ha scelti il giocatore
aggiornaHUD();
aggiornaAbilita();
aggiornaSpara();
rendiNegozio();

// ponte di controllo: serve ai controlli automatici e per vedere dal vivo che cosa
// sta facendo il tavolo (quante lire, che modalità, quante ne ha ritirate).
window.DOZER = {
  stato, lire, MAX_LIRE, VERSIONE, Z_LANCIO, X_LANCIO_MAX, ALTEZZA_PIASTRA,
  FRONTE_AVANTI, FRONTE_INDIETRO, PLATE_D,
  lireSulTavolo, riciclaEccesso, modoAttuale, cambiaAbilita, cambiaOpzione, aggiornaAbilita,
  pusherAvanti: () => pusherZ < PUSHER_MIN + 0.12,   // a che punto della corsa e' il ripiano
  creaLira, lanciaLira, aggiornaFisica, aggiornaHUD, rendiNegozio
};

animate();
</script>
